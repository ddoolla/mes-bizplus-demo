<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<div th:fragment="filter (url, inspectionGroups, count, showActions)">
    <form method="GET" th:action="${url}">
        <table class="app-table-input">
            <colgroup>
                <col style="width: 150px">
                <col style="width: auto">
                <col style="width: 150px">
                <col style="width: auto">
                <col style="width: 150px">
                <col style="width: auto">
            </colgroup>
            <tbody>
            <tr>
                <th>검사그룹</th>
                <td>
                    <select name="groupId"
                            class="app-form-control app-xs"
                            th:value="${param.groupId}">
                        <option value="">전체</option>
                        <option th:if="${#lists.isEmpty(inspectionGroups)}" disabled>
                            등록된 검사그룹이 없습니다.
                        </option>
                        <option th:each="group : ${inspectionGroups}"
                                th:value="${group.id}"
                                th:text="${@format.codeName(group.code, group.name)}"
                                th:selected="${#strings.equals(param.group, group.id)}"></option>
                    </select>
                </td>
                <th>검사항목 코드</th>
                <td>
                    <input type="text"
                           name="code"
                           class="app-form-control app-xs"
                           th:value="${param.code}">
                </td>
                <th>검사항목명</th>
                <td>
                    <input type="text"
                           name="name"
                           class="app-form-control app-xs"
                           th:value="${param.name}">
                </td>
            </tr>
            </tbody>
        </table>

        <div class="mt-2 mb-2 text-end">
            <button type="submit" class="btn btn-secondary btn-sm">
                <i class="bi bi-search"></i> 조회
            </button>
        </div>

        <div class="d-flex justify-content-between mb-2">
            <div class="fw-bold"
                 th:text="|Total : ${count} 건|">
            </div>
            <div>
                <th:block th:if="${showActions}">
                    <button type="button"
                            id="inspection-item-create-button"
                            class="btn btn-primary btn-sm"
                            sec:authorize="hasAuthority('INSPECTION_ITEM_CREATE')">
                        <i class="bi bi-plus-circle"></i> 등록
                    </button>
                    <button type="button"
                            id="inspection-item-delete-button"
                            class="btn btn-danger btn-sm"
                            sec:authorize="hasAuthority('INSPECTION_ITEM_DELETE')">
                        <i class="bi bi-trash"></i> 삭제
                    </button>
                </th:block>
            </div>
        </div>
    </form>
</div>

</html>
