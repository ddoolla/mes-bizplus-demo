<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('BOM 수정', ~{}, ~{::script}, 'BOM', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script th:src="@{/js/item/modal/single-select.js}"></script>
    <script th:src="@{/js/item/modal/multi-select.js}"></script>
    <script th:src="@{/js/bom/edit.js}"></script>
    <script th:src="@{/js/bom-item/form.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('BOM 수정', '기준정보관리, BOM관리, 상세, 수정')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/boms}'|">
            <i class="fa fa-arrow-left" aria-hidden="true"></i> 목록
        </button>

        <button type="submit"
                form="bom-edit-form"
                class="btn btn-primary btn-sm"
                sec:authorize="hasAuthority('BOM_UPDATE')">
            <i class="fa fa-pencil" aria-hidden="true"></i> 저장
        </button>
    </div>

    <form id="bom-edit-form"
          method="post"
          th:action="@{/boms/{id}(id=${bom.id})}"
          th:object="${bom}">
        <!--/* BOM 수정 폼 */-->
        <div class="app-box app-box-bg">

            <input type="hidden" name="id" th:value="*{id}"/>

            <table class="app-table-input">
                <colgroup>
                    <col style="width: 150px">
                    <col style="width: auto">
                </colgroup>
                <tbody>
                <tr>
                    <th>
                        BOM 코드 <span class="app-required">*</span>
                    </th>
                    <td>
                        <input type="text"
                               name="code"
                               class="app-form-control app-xs"
                               th:value="*{code}"
                               placeholder="BOM 코드를 입력해 주세요."/>
                    </td>
                </tr>
                <tr>
                    <th>
                        BOM명 <span class="app-required">*</span>
                    </th>
                    <td>
                        <input type="text"
                               name="name"
                               class="app-form-control app-xs"
                               th:value="*{name}"
                               placeholder="BOM명을 입력해 주세요."/>
                    </td>
                </tr>
                <tr>
                    <th>
                        제품 <span class="app-required">*</span>
                    </th>
                    <td>
                        <input type="text"
                               name="itemName"
                               th:value="*{item.name}"
                               class="app-form-control app-xs app-readonly-bg w-25"
                               placeholder="제품을 선택해 주세요."/>
                        <input type="hidden"
                               name="itemId"
                               th:value="*{item.id}"/>
                        <button type="button"
                                id="item-list-button"
                                class="btn btn-secondary app-btn-xs">
                            <i class="bi bi-list"></i> 제품 목록
                        </button>
                    </td>
                </tr>
                <tr>
                    <th>
                        비고
                    </th>
                    <td>
                        <input type="text"
                               name="remark"
                               th:value="*{remark}"
                               class="app-form-control app-xs"/>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!--/* BOM 구성 품목 폼 */-->
        <div th:replace="~{pages/bom-item/fragments/form :: form (${bom}, ${bomItems}, ${uoms})}"></div>
    </form>

    <!--/* BOM 수정용 품목 모달 */-->
    <div th:replace="~{pages/item/modal/list :: list (
        'item-single-select-modal',
        '/items/modal/single-select-list',
        ${itemCategories},
        ${productItemTypes})}">
    </div>

    <!--/* BOM 구성품 등록용 모달 */-->
    <div th:replace="~{pages/item/modal/list :: list (
        'item-multi-select-modal',
        '/items/modal/multi-select-list',
        ${itemCategories},
        ${bomItemTypes})}">
    </div>
</div>
</body>
</html>
