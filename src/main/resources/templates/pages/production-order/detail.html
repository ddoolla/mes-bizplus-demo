<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('생산지시 상세', ~{}, ~{::script}, 'PRODUCTION_ORDER', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script type="module" th:src="@{/js/pages/production-order/detail.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('생산지시 상세', '생산관리, 생산지시, 상세')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/production-orders}'|">
            <i class="bi bi-list"></i> 목록
        </button>

        <button type="button"
                class="btn btn-primary btn-sm"
                th:onclick="|location.href='@{/production-orders/{id}/edit(id=${productionOrder.id})}'|"
                sec:authorize="hasAuthority('PRODUCTION_ORDER_UPDATE')">
            <i class="bi bi-pencil-square"></i> 수정
        </button>
        <button th:if="${productionOrder.status?.name == 'DRAFT'}"
                type="button"
                id="production-order-confirm-button"
                class="btn btn-success btn-sm"
                th:data-id="${productionOrder.id}"
                th:data-item-id="${productionOrder.item.id}"
                sec:authorize="hasAuthority('PRODUCTION_ORDER_UPDATE')">
            <i class="bi bi-check-circle"></i> 확정
        </button>
    </div>

    <!--/* 생산지시 상세 정보 */-->
    <div class="app-box app-box-bg">

        <table class="app-table-input" th:object="${productionOrder}">
            <colgroup>
                <col style="width: 150px">
                <col style="width: 500px">
                <col style="width: 150px">
                <col style="width: auto">
            </colgroup>
            <tbody>
            <tr>
                <th>생산지시 번호</th>
                <td colspan="3" th:text="*{orderNo}"></td>
            </tr>
            <tr>
                <th>제품 코드</th>
                <td th:text="*{item.code}"></td>
                <th>제품명</th>
                <td th:text="*{item.name}"></td>
            </tr>
            <tr>
                <th>규격</th>
                <td th:text="${@format.value(productionOrder.item.specification)}"></td>
                <th>단위</th>
                <td th:text="${productionOrder.item.uom.code}"></td>
            </tr>
            <tr>
                <th>제품 BOM</th>
                <td th:text="*{bom.name}"></td>
                <th>제품 공정</th>
                <td th:text="*{routing.name}"></td>
            </tr>
            <tr>
                <th>생산 수량</th>
                <td th:text="|${#numbers.formatDecimal(
                        productionOrder.quantity,1, productionOrder.item.uom.scale)}|">
                </td>
                <th>생산 예정일</th>
                <td th:text="${#temporals.format(productionOrder.dueDate, 'yyyy-MM-dd')}"></td>
            </tr>
            <tr>
                <th>생산 로트</th>
                <td colspan="3" th:text="*{lot.no} ?: '생산지시 확정 시 생성됩니다.'"></td>
            </tr>
            <tr>
                <th>비고</th>
                <td colspan="3" th:text="${@format.value(productionOrder.remark)}"></td>
            </tr>
            <tr>
                <th>상태</th>
                <td colspan="3" th:switch="${productionOrder.status?.name}">
                    <h6 th:case="'DRAFT'" class="mb-0">
                            <span class="badge text-bg-secondary p-2"
                                  th:text="${productionOrder.status?.description}"></span>
                    </h6>
                    <h6 th:case="'CONFIRMED'" class="mb-0">
                            <span class="badge text-bg-primary p-2"
                                  th:text="${productionOrder.status?.description}"></span>
                    </h6>
                    <h6 th:case="'IN_PROGRESS'" class="mb-0">
                            <span class="badge text-bg-warning p-2"
                                  th:text="${productionOrder.status?.description}"></span>
                    </h6>
                    <h6 th:case="'COMPLETED'" class="mb-0">
                            <span class="badge text-bg-success p-2"
                                  th:text="${productionOrder.status?.description}"></span>
                    </h6>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!--/* 작업지시 목록 */-->
    <div th:replace="~{pages/work-order/fragments/list :: list (${workOrders})}"></div>
</div>
</body>
</html>
