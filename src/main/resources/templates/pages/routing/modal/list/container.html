<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!--/* 제품공정 목록 모달 */-->
<th:block th:fragment="container">
    <div th:replace="~{fragments/modal/default :: default (
        'routing-list-modal',
        '제품 공정 목록',
         ~{::content},
         700
    )}">
        <div th:fragment="content" class="p-2">
            <div class="modal-body pt-0">

                <!--/* 제품공정 목록 */-->
                <div class="routing-list"></div>
            </div>
        </div>
    </div>
</th:block>

</html>
