<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!--/* 품목 목록 모달 */-->
<th:block th:fragment="modal">
    <div th:replace="~{fragments/modal/default :: default (
        'sales-order-select-modal',
        '수주 선택',
         ~{::.app-modal-content},
         1200
    )}">
        <div class="app-modal-content p-2"></div>
    </div>
</th:block>

<!--/* 품목 목록 모달 콘텐츠 */-->
<th:block th:fragment="content">
    <div class="modal-body pt-0">
        <div>
            <div class="fw-bold"
                 th:text="|Total : ${salesOrders.size()} 건|">
            </div>
        </div>
        <div id="item-table">
            <table class="app-table-list text-center">
                <colgroup>
                    <col style="width: 150px">
                    <col style="width: 200px">
                    <col style="width: 150px">
                    <col style="width: 150px">
                    <col style="width: auto">
                    <col style="width: 120px">
                    <col style="width: 120px">
                </colgroup>
                <thead>
                <tr>
                    <th>수주 번호</th>
                    <th>제목</th>
                    <th>수주일자</th>
                    <th>납기일자</th>
                    <th>비고</th>
                    <th>상태</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(salesOrders)}">
                    <td colspan="8" class="p-4">등록된 수주 정보가 없습니다.</td>
                </tr>
                <tr th:each="salesOrder : ${salesOrders}">
                    <td th:text="${salesOrder.orderNo}"></td>
                    <td th:text="${@format.value(salesOrder.name)}"></td>
                    <td th:text="${#temporals.format(salesOrder.date, 'yyyy-MM-dd')}"></td>
                    <td th:text="${#temporals.format(salesOrder.dueDate, 'yyyy-MM-dd')}"></td>
                    <td th:text="${@format.value(salesOrder.remark)}"></td>
                    <td th:switch="${salesOrder.status?.name}">
                        <h6 th:case="'DRAFT'" class="mb-0">
                            <span class="badge text-bg-secondary p-2 app-w-80"
                                  th:text="${salesOrder.status?.description}"></span>
                        </h6>
                        <h6 th:case="'CONFIRMED'" class="mb-0">
                            <span class="badge text-bg-info p-2 app-w-80"
                                  th:text="${salesOrder.status?.description}"></span>
                        </h6>
                        <h6 th:case="'PARTIALLY_SHIPPED'" class="mb-0">
                            <span class="badge text-bg-primary p-2 app-w-80"
                                  th:text="${salesOrder.status?.description}"></span>
                        </h6>
                        <h6 th:case="'COMPLETED'" class="mb-0">
                            <span class="badge text-bg-success p-2 app-w-80"
                                  th:text="${salesOrder.status?.description}"></span>
                        </h6>
                    </td>
                    <td>
                        <button type="button"
                                class="sales-order-select-button
                                       btn btn-primary btn-sm app-w-80"
                                th:data-id="${salesOrder.id}"
                                th:data-order-no="${salesOrder.orderNo}">
                            선택
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>

</html>
