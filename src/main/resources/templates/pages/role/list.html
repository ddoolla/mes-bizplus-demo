<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout ('권한 목록', ~{}, ~{::script}, 'ROLE', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script th:src="@{/js/common/checkbox.js}"></script>
    <script th:src="@{/js/common/ajax.js}"></script>
    <script th:src="@{/js/role/list.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('권한 목록', '시스템 관리, 권한 관리')}">
    </div>

    <!--/* 바디 */-->
    <div class="app-box app-box-bg">
        <!--/* 필터 */-->
        <div th:replace="~{pages/role/fragments/filter :: filter ('/roles', ${data.pagination.totalElements}, true)}">
        </div>

        <!--/* 목록 */-->
        <div id="role-list">
            <table class="app-table-list text-center">
                <colgroup>
                    <col style="width: 50px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: auto">
                </colgroup>
                <thead>
                <tr>
                    <th><input type="checkbox" class="check-all"/></th>
                    <th>권한 코드</th>
                    <th>권한 이름</th>
                    <th>설명</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="role : ${data.roles}">
                    <td>
                        <input type="checkbox"
                               class="check-item"
                               th:unless="${role.code == 'ADMIN'}"
                               th:value="${role.id}"/>
                    </td>
                    <td class="fw-bold">
                        <a th:href="@{/roles/{id}(id=${role.id})}"
                           th:text="${role.code}"></a>
                    </td>
                    <td th:text="${role.name}"></td>
                    <td th:text="${role.description}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <!--/* 페이지네이션 */-->
        <div th:replace="~{fragments/pagination :: pagination (${data.pagination})}"></div>
    </div>
</div>
</body>
</html>
