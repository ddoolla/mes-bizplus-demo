<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<div th:fragment="filter (url, count)">
    <form id="production-order-search-form" method="GET" th:action="${url}">
        <table class="app-table-input">
            <colgroup>
                <col style="width: 150px">
                <col style="width: auto">
                <col style="width: 150px">
                <col style="width: auto">
                <col style="width: 150px">
                <col style="width: 500px">
            </colgroup>
            <tbody>
            <tr>
                <th>생산지시 번호</th>
                <td>
                    <input type="text"
                           name="orderNo"
                           class="app-form-control app-xs"
                           th:value="${param.orderNo}">
                </td>
                <th>품목</th>
                <td>
                    <input type="text"
                           name="itemName"
                           class="app-form-control app-xs"
                           th:value="${param.itemName}">
                </td>
                <th>기간</th>
                <td>
                    <div class="d-flex gap-2 align-items-center">
                        <input type="text"
                               name="startDate"
                               class="app-form-control app-xs"
                               th:value="${param.startDate}"
                               readonly autocomplete="off"/>
                        <span>-</span>
                        <input type="text"
                               name="endDate"
                               class="app-form-control app-xs"
                               th:value="${param.endDate}"
                               readonly autocomplete="off"/>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="mt-2 mb-2 text-end">
            <button type="submit" class="btn btn-secondary btn-sm">
                <i class="bi bi-search"></i> 조회
            </button>
        </div>

        <div class="d-flex justify-content-between mb-2">
            <div class="fw-bold"
                 th:text="|Total : ${count} 건|">
            </div>
            <div>
                <button type="button"
                        class="btn btn-primary btn-sm"
                        th:onclick="|location.href='@{/production-orders/new}'|"
                        sec:authorize="hasAuthority('PRODUCTION_ORDER_CREATE')">
                    <i class="bi bi-plus-circle"></i> 등록
                </button>
                <button type="button"
                        id="production-order-delete-button"
                        class="btn btn-danger btn-sm"
                        sec:authorize="hasAuthority('PRODUCTION_ORDER_DELETE')">
                    <i class="bi bi-trash"></i> 삭제
                </button>
            </div>
        </div>
    </form>
</div>

</html>
