<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('사용자 수정', ~{}, ~{::script}, 'USER', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script th:src="@{/js/user/edit.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('사용자 수정', '시스템관리, 사용자관리, 상세, 수정')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/users}'|">
            <i class="fa fa-arrow-left" aria-hidden="true"></i> 목록
        </button>

        <button type="submit"
                form="edit-user-form"
                class="btn btn-primary btn-sm"
                sec:authorize="hasAuthority('USER_UPDATE')">
            <i class="fa fa-pencil" aria-hidden="true"></i> 저장
        </button>
    </div>

    <!--/* 바디 */-->
    <div class="app-box app-box-bg">
        <form id="edit-user-form"
              method="post"
              th:action="@{/users/{id}(id=${user.id})}"
              th:object="${user}">
            <table class="app-table-input">
                <colgroup>
                    <col style="width: 150px">
                    <col style="width: auto">
                </colgroup>
                <tbody>
                <tr>
                    <th>사용자 ID</th>
                    <td th:text="*{userId}"></td>
                </tr>
                <tr>
                    <th>
                        <label for="password">비밀번호</label>
                    </th>
                    <td>
                        <input type="password"
                               id="password"
                               name="password"
                               class="app-form-control app-xs"/>
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="passwordConfirm">비밀번호 확인</label>
                    </th>
                    <td>
                        <input type="password"
                               id="passwordConfirm"
                               name="passwordConfirm"
                               class="app-form-control app-xs"/>
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="name">
                            사용자명 <span class="app-required">*</span>
                        </label>
                    </th>
                    <td>
                        <input type="text"
                               id="name"
                               name="name"
                               class="app-form-control app-xs"
                               th:value="*{name}"
                               placeholder="사용자 이름을 입력해 주세요."/>
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="email">이메일</label>
                    </th>
                    <td>
                        <input type="text"
                               id="email"
                               name="email"
                               class="app-form-control app-xs"
                               th:value="*{email}"/>
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="phone">휴대폰 번호</label>
                    </th>
                    <td>
                        <input type="text"
                               id="phone"
                               name="phone"
                               class="app-form-control app-xs"
                               th:value="*{phone}"/>
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="departmentId">부서</label>
                    </th>
                    <td>
                        <select name="departmentId"
                                id="departmentId"
                                class="app-form-control app-xs">
                            <option value="">
                                부서 선택
                            </option>
                            <option th:if="${#lists.isEmpty(departments)}" value="" disabled>
                                등록된 부서가 없습니다.
                            </option>
                            <option th:unless="${#lists.isEmpty(departments)}"
                                    th:each="department : ${departments}"
                                    th:value="${department.id}"
                                    th:text="${department.name}"
                                    th:selected="${department.id == user.department.id}">
                            </option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="positionId">직책</label>
                    </th>
                    <td>
                        <select name="positionId"
                                id="positionId"
                                class="app-form-control app-xs">
                            <option value="">
                                직책 선택
                            </option>
                            <option th:if="${#lists.isEmpty(positions)}" value="" disabled>
                                등록된 직책이 없습니다.
                            </option>
                            <option th:unless="${#lists.isEmpty(positions)}"
                                    th:each="position : ${positions}"
                                    th:value="${position.id}"
                                    th:text="${position.name}"
                                    th:selected="${position.id == user.position.id}">
                            </option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="roleId">권한</label>
                    </th>
                    <td>
                        <select name="roleId"
                                id="roleId"
                                class="app-form-control app-xs">
                            <option th:each="role : ${roles}"
                                    th:value="${role.id}"
                                    th:text="${role.name}"
                                    th:selected="${role.id == user.role.id}">
                            </option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="remark">비고</label>
                    </th>
                    <td>
                        <input type="text"
                               id="remark"
                               name="remark"
                               class="app-form-control app-xs"
                               th:value="*{remark}"/>
                    </td>
                </tr>
                </tbody>
            </table>
        </form>
    </div>
</div>
</body>
</html>
