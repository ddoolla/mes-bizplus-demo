<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout ('설비 목록', ~{}, ~{::script}, 'EQUIPMENT', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script type="module" th:src="@{/js/pages/equipment/list.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('설비 목록', '기준정보관리, 설비관리')}">
    </div>

    <!--/* 바디 */-->
    <div class="app-box app-box-bg">
        <!--/* 필터 */-->
        <div th:replace="~{pages/equipment/fragments/filter :: filter (
            '/equipments',
            ${equipmentTypes},
            ${data.pagination.totalElements},
            true)}">
        </div>

        <!--/* 목록 */-->
        <div id="equipment-table">
            <table class="app-table-list text-center">
                <colgroup>
                    <col style="width: 50px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: auto">
                </colgroup>
                <thead>
                <tr>
                    <th><input type="checkbox" class="check-all"/></th>
                    <th>설비 코드</th>
                    <th>설비명</th>
                    <th>설비 유형</th>
                    <th>규격</th>
                    <th>제조사</th>
                    <th>모델</th>
                    <th>시리얼 번호</th>
                    <th>위치</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="equipment : ${data.equipments}">
                    <td>
                        <input type="checkbox"
                               class="check-item"
                               th:value="${equipment.id}"/>
                    </td>
                    <td class="fw-bold">
                        <a th:href="@{/equipments/{id}(id=${equipment.id})}"
                           th:text="${equipment.code}"></a>
                    </td>
                    <td th:text="${equipment.name}"></td>
                    <td th:text="${@format.codeName(equipment.type.code, equipment.type.name)}"></td>
                    <td th:text="${@format.value(equipment.specification)}"></td>
                    <td th:text="${@format.value(equipment.manufacturer)}"></td>
                    <td th:text="${@format.value(equipment.model)}"></td>
                    <td th:text="${@format.value(equipment.serialNo)}"></td>
                    <td th:text="${@format.value(equipment.location)}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <!--/* 페이지네이션 */-->
        <div th:replace="~{fragments/pagination :: pagination (${data.pagination})}"></div>
    </div>
</div>
</body>
</html>
