<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('사용자 상세', ~{}, ~{}, 'USER', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('사용자 상세', '시스템관리, 사용자관리, 상세')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/users}'|">
            <i class="bi bi-list"></i> 목록
        </button>

        <button type="button"
                class="btn btn-primary btn-sm"
                th:onclick="|location.href='@{/users/{id}/edit(id=${user.id})}'|"
                sec:authorize="hasAuthority('USER_UPDATE')">
            <i class="bi bi-pencil-square"></i> 수정
        </button>
    </div>

    <!--/* 상세 정보 */-->
    <div class="app-box app-box-bg">

        <table class="app-table-input" th:object="${user}">
            <colgroup>
                <col style="width: 150px">
                <col style="width: auto">
            </colgroup>
            <tbody>
            <tr>
                <th>사용자 ID</th>
                <td th:text="*{userId}"></td>
            </tr>
            <tr>
                <th>사용자명</th>
                <td th:text="*{name}"></td>
            </tr>
            <tr>
                <th>이메일</th>
                <td th:text="${@format.value(user.email)}"></td>
            </tr>
            <tr>
                <th>휴대폰 번호</th>
                <td th:text="${@format.phoneNo(user.phone)}"></td>
            </tr>
            <tr>
                <th>부서</th>
                <td th:text="${@format.value(user.department.name)}"></td>
            </tr>
            <tr>
                <th>직책</th>
                <td th:text="${@format.value(user.position.name)}"></td>
            </tr>
            <tr>
                <th>권한</th>
                <td th:text="${@format.value(user.role.name)}"></td>
            </tr>
            <tr>
                <th>비고</th>
                <td th:text="${@format.value(user.remark)}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
