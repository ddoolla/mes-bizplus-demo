<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout ('작업자 목록', ~{}, ~{::script}, 'WORKER', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script type="module" th:src="@{/js/pages/worker/list.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('작업자 목록', '기준정보관리, 작업자관리')}">
    </div>

    <!--/* 바디 */-->
    <div class="app-box app-box-bg">
        <!--/* 필터 */-->
        <div th:replace="~{pages/worker/fragments/filter :: filter (
            '/workers',
            ${departments},
            ${positions},
            ${data.pagination.totalElements},
            true)}">
        </div>

        <!--/* 목록 */-->
        <div id="worker-table">
            <table class="app-table-list text-center">
                <colgroup>
                    <col style="width: 50px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: auto">
                </colgroup>
                <thead>
                <tr>
                    <th><input type="checkbox" class="check-all"/></th>
                    <th>작업자 코드</th>
                    <th>작업자명</th>
                    <th>부서</th>
                    <th>직책</th>
                    <th>전화</th>
                    <th>이메일</th>
                    <th>비고</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="worker : ${data.workers}">
                    <td>
                        <input type="checkbox"
                               class="check-item"
                               th:value="${worker.id}"/>
                    </td>
                    <td class="fw-bold">
                        <a th:href="@{/workers/{id}(id=${worker.id})}"
                           th:text="${worker.code}"></a>
                    </td>
                    <td th:text="${worker.user.name}"></td>
                    <td th:text="${@format.value(worker.user.department)}"></td>
                    <td th:text="${@format.value(worker.user.position)}"></td>
                    <td th:text="${@format.phoneNo(worker.user.phone)}"></td>
                    <td th:text="${@format.value(worker.user.email)}"></td>
                    <td th:text="${@format.value(worker.remark)}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <!--/* 페이지네이션 */-->
        <div th:replace="~{fragments/pagination :: pagination (${data.pagination})}"></div>
    </div>
</div>
</body>
</html>
