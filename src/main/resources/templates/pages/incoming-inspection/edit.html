<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('입고검사 수정', ~{}, ~{::script}, 'INCOMING_INSPECTION', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script type="module" th:src="@{/js/pages/incoming-inspection/edit.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('입고검사 수정', '품질관리, 입고검사, 상세, 수정')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/incoming-inspections/{id}(id=${incomingInspection.id})}'|">
            <i class="bi bi-x-circle"></i> 취소
        </button>

        <button type="submit"
                form="incoming-inspection-edit-form"
                class="btn btn-primary btn-sm"
                sec:authorize="hasAuthority('INCOMING_INSPECTION_UPDATE')">
            <i class="bi bi-floppy"></i> 저장
        </button>
    </div>

    <form id="incoming-inspection-edit-form"
          method="post"
          th:action="@{/incoming-inspections/{id}(id=${incomingInspection.id})}"
          th:object="${incomingInspection}"
          th:with="receiptItem=*{receiptItem}, inspection=*{inspection}">

        <input type="hidden" name="id" th:value="*{id}"/>

        <!--/* 수정 양식 */-->
        <div class="app-box app-box-bg">
            <table class="app-table-input">
                <colgroup>
                    <col style="width: 150px">
                    <col style="width: 500px">
                    <col style="width: 150px">
                    <col style="width: auto">
                </colgroup>
                <tbody>
                <tr>
                    <th>검사 번호</th>
                    <td th:text="*{inspection.inspectionNo}"></td>
                    <th>입고 번호</th>
                    <td th:text="*{receiptItem.receipt.no}"></td>
                </tr>
                <tr>
                    <th>검사 유형</th>
                    <td th:text="*{inspection.type?.description}"></td>
                    <th>품목 코드</th>
                    <td th:text="*{receiptItem.item.code}"></td>
                </tr>
                <tr>
                    <th>검사 일자 <span class="app-required">*</span></th>
                    <td>
                        <input type="text"
                               name="date"
                               class="app-form-control app-xs"
                               th:value="${#temporals.format(inspection.date, 'yyyy-MM-dd')}"
                               readonly/>

                    </td>
                    <th>품목명</th>
                    <td th:text="*{receiptItem.item.name}"></td>
                </tr>
                <tr>
                    <th>검사 수량 <span class="app-required">*</span></th>
                    <td>
                        <input type="number"
                               name="inspectedQuantity"
                               class="app-form-control app-xs"
                               th:value="${#numbers.formatDecimal(inspection.inspectedQuantity, 1, 0)}"/>

                        <input type="hidden" name="uomScale" th:value="*{inspection.uom.scale}"/>
                    </td>
                    <th>유형</th>
                    <td th:text="*{receiptItem.item.type?.description}"></td>
                </tr>
                <tr>
                    <th>검사자</th>
                    <td th:text="${@format.value(inspection.inspector.name)}"></td>
                    <th>규격</th>
                    <td th:text="${@format.value(receiptItem.item.specification)}"></td>
                </tr>
                <tr>
                    <th>LOT</th>
                    <td colspan="3" th:text="${@format.value(receiptItem.lot.no)}"></td>
                </tr>
                <tr>
                    <th>비고</th>
                    <td colspan="3">
                        <input type="text"
                               name="remark"
                               class="app-form-control app-xs"
                               th:value="${inspection.remark}"/>
                    </td>
                </tr>
                <tr>
                    <th>상태</th>
                    <td th:switch="*{inspection.status?.name}">
                        <h6 th:case="'PENDING'" class="mb-0">
                            <span class="badge text-bg-secondary p-2 app-w-80"
                                  th:text="*{inspection.status?.description}"></span>
                        </h6>
                        <h6 th:case="'COMPLETED'" class="mb-0">
                            <span class="badge text-bg-success p-2 app-w-80"
                                  th:text="*{inspection.status?.description}"></span>
                        </h6>
                    </td>
                    <th>판정</th>
                    <td th:switch="*{inspection.judgement?.name}">
                        <h6 th:case="'PASS'" class="mb-0">
                            <span class="badge text-bg-success p-2 app-w-80"
                                  th:text="*{inspection.judgement?.description}"></span>
                        </h6>
                        <h6 th:case="'FAIL'" class="mb-0">
                            <span class="badge text-bg-danger p-2 app-w-80"
                                  th:text="*{inspection.judgement?.description}"></span>
                        </h6>
                        <h6 th:case="*" class="mb-0">
                            <span class="badge text-bg-secondary p-2 app-w-80">미판정</span>
                        </h6>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!--/* 검사항목 */-->
        <div th:replace="~{pages/inspection-result/fragments/form :: form (${incomingInspection.inspection}, ${inspectionResults})}"></div>
    </form>
</div>
</body>
</html>
