<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="form (receipt, receiptItemData)">
    <div class="app-box app-box-bg mt-2">
        <div class="d-flex justify-content-between">
            <div>
                <p class="h5 fw-bold">입고 자재</p>
            </div>
            <div>
                <th:block th:if="${receipt.status?.name == 'DRAFT'}">
                    <button type="button"
                            id="receipt-item-create-button"
                            class="btn btn-primary btn-sm me-1"
                            th:data-receipt-id="${receipt.id}">
                        <i class="bi bi-plus-circle"></i> 추가
                    </button>
                    <button type="button"
                            id="receipt-item-delete-button"
                            class="btn btn-danger btn-sm">
                        <i class="bi bi-trash"></i> 삭제
                    </button>
                </th:block>
            </div>
        </div>

        <div id="receipt-item-table">
            <table class="app-table-list text-center">
                <colgroup>
                    <col style="width: 50px">
                    <col style="width: 180px">
                    <col style="width: 180px">
                    <col style="width: 180px">
                    <col style="width: 120px">
                    <col style="width: 120px">
                    <col style="width: 120px">
                    <col style="width: 120px">
                    <col style="width: 120px">
                    <col style="width: auto">
                    <col style="width: 80px">
                    <col style="width: 80px">
                </colgroup>
                <thead>
                <tr>
                    <th>
                        <input type="checkbox"
                               class="check-all"
                               th:disabled="${receipt.status?.name != 'DRAFT'}">
                    </th>
                    <th>자재 코드</th>
                    <th>자재명</th>
                    <th>LOT</th>
                    <th>재고 단위</th>
                    <th>입고 수량</th>
                    <th>입고 단위</th>
                    <th>단가</th>
                    <th>금액</th>
                    <th>비고</th>
                    <th>검사 대상</th>
                    <th>자동 생성</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(receiptItemData)}">
                    <td colspan="12" class="p-4">등록된 입고 자재 정보가 없습니다.</td>
                </tr>
                <tr th:each="data, stat : ${receiptItemData}"
                    th:with="receiptItem=${data.receiptItem},
                             convertibleUoms=${data.convertibleUoms},
                             stockUom=${receiptItem.item.uom}">

                    <input type="hidden"
                           th:name="|receiptItems[${stat.index}].id|"
                           th:value="${receiptItem.id}"/>

                    <td>
                        <input type="checkbox"
                               class="check-item"
                               th:value="${receiptItem.id}"
                               th:disabled="${receipt.status?.name != 'DRAFT'}"/>
                    </td>
                    <td th:text="${receiptItem.item.code}"></td>
                    <td th:text="${receiptItem.item.name}"></td>
                    <td th:text="${receiptItem.lot.no ?: '-'}"></td>
                    <td th:text="${receiptItem.item.uom.code}"></td>
                    <td>
                        <input type="number"
                               th:name="|receiptItems[${stat.index}].quantity|"
                               class="receipt-item-quantity
                                      app-form-control app-xs "
                               th:value="${#numbers.formatDecimal(receiptItem.quantity, 1, receiptItem.uom.scale)}"
                               th:disabled="${receipt.status?.name != 'DRAFT'}"
                               min="0"/>
                    </td>
                    <td>
                        <select class="receipt-item-uom
                                           app-form-control app-xs"
                                th:name="|receiptItems[${stat.index}].uomId|"
                                th:disabled="${receipt.status?.name != 'DRAFT'}">
                            <!--/* 변환 가능 단위 */-->
                            <option th:each="convertibleUom : ${convertibleUoms}"
                                    th:value="${convertibleUom.id}"
                                    th:text="${convertibleUom.code}"
                                    th:selected="${convertibleUom.id == receiptItem.uom.id}"
                                    th:data-scale="${convertibleUom.scale}">
                            </option>
                        </select>
                    </td>
                    <td>
                        <input type="number"
                               th:name="|receiptItems[${stat.index}].unitPrice|"
                               class="receipt-item-unit-price
                                      app-form-control app-xs "
                               th:value="${#numbers.formatDecimal(receiptItem.unitPrice, 1, 0)}"
                               th:disabled="${receipt.status?.name != 'DRAFT'}"
                               min="0"/>
                    </td>
                    <td>
                        <span class="receipt-item-amount"
                              th:text="${#numbers.formatDecimal(receiptItem.amount, 1, 'COMMA', 0, 'POINT')} ?: '-'"></span>
                    </td>
                    <td>
                        <input type="text"
                               th:name="|receiptItems[${stat.index}].remark|"
                               class="app-form-control app-xs "
                               th:value="${receiptItem.remark}"/>
                    </td>
                    <td th:text="${receiptItem.inspectionRequired ? '예' : '아니오'}"></td>
                    <td>
                        <input type="checkbox"
                               th:name="|receiptItems[${stat.index}].inspectionAutoCreate|"
                               value="true"
                               th:checked="${receiptItem.inspectionAutoCreate}"
                               th:disabled="${receipt.status?.name != 'DRAFT' || !receiptItem.inspectionRequired}"/>
                    </td>
                </tr>
                <tr th:unless="${#lists.isEmpty(receiptItemData)}">
                    <td colspan="7"></td>
                    <td class="pt-3 fw-bold">합계</td>
                    <td class="pt-3 fw-bold total-amount"></td>
                    <td colspan="3"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>

</html>
