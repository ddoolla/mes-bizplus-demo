<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!--/* 제품 다중 선택 모달 */-->
<th:block th:fragment="modal (url, itemGroup, itemCategories, itemTypes)">
    <div th:replace="~{fragments/modal/default :: default (
        'item-multi-select-modal',
        '품목 선택',
         ~{::.app-modal-content},
         1200
    )}">
        <div class="app-modal-content p-2">
            <div class="modal-body">
                <!--/* 필터 */-->
                <div th:replace="~{/pages/item/modal/filter :: filter (
                    ${url},
                    ${itemGroup},
                    ${itemCategories},
                    ${itemTypes})}">
                </div>

                <!--/* 목록 */-->
                <div class="list-content"></div>
            </div>
        </div>
    </div>
</th:block>

<!--/* 모달 목록 콘텐츠 (재고 미포함) */-->
<th:block th:fragment="list">
    <div class="d-flex justify-content-sm-between mt-1">
        <div class="d-flex align-items-end">
            <p class="fw-bold mb-0"
               th:text="|Total : ${data.pagination.totalElements} 건|"></p>
        </div>
        <div>
            <button type="button"
                    class="item-register-button
                           btn btn-primary btn-sm">
                <i class="bi bi-check-circle"></i> 등록
            </button>
        </div>
    </div>
    <div>
        <table class="app-table-list text-center">
            <colgroup>
                <col style="width: 50px">
                <col style="width: 200px">
                <col style="width: 200px">
                <col style="width: 150px">
                <col style="width: 150px">
                <col style="width: auto">
                <col style="width: 150px">
            </colgroup>
            <thead>
            <tr>
                <th><input type="checkbox" class="check-all"/></th>
                <th>품목 코드</th>
                <th>품목명</th>
                <th>유형</th>
                <th>카테고리</th>
                <th>규격</th>
                <th>단위</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(data.items)}">
                <td colspan="7" class="p-4">등록된 품목 정보가 없습니다.</td>
            </tr>
            <tr th:each="item : ${data.items}">
                <td>
                    <input type="checkbox"
                           class="check-item"
                           th:value="${item.id}"/>
                </td>
                <td th:text="${item.code}"></td>
                <td th:text="${item.name}"></td>
                <td th:text="${item.type?.description}"></td>
                <td th:text="${@format.value(item.category.name)}"></td>
                <td th:text="${@format.value(item.specification)}"></td>
                <td th:text="${item.uom.code}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!--/* 페이지네이션 */-->
    <div th:replace="~{fragments/pagination :: pagination (${data.pagination})}"></div>
</th:block>

<!--/* 모달 목록 콘텐츠 (재고 포함) */-->
<th:block th:fragment="stock-list">
    <div class="d-flex justify-content-sm-between mt-1">
        <div class="d-flex align-items-end">
            <p class="fw-bold mb-0"
               th:text="|Total : ${data.pagination.totalElements} 건|"></p>
        </div>
        <div>
            <button type="button"
                    class="item-register-button
                           btn btn-primary btn-sm">
                <i class="bi bi-check-circle"></i> 등록
            </button>
        </div>
    </div>
    <div>
        <table class="app-table-list text-center">
            <colgroup>
                <col style="width: 50px">
                <col style="width: 200px">
                <col style="width: 200px">
                <col style="width: 150px">
                <col style="width: 150px">
                <col style="width: auto">
                <col style="width: 150px">
            </colgroup>
            <thead>
            <tr>
                <th><input type="checkbox" class="check-all"/></th>
                <th>품목 코드</th>
                <th>품목명</th>
                <th>유형</th>
                <th>카테고리</th>
                <th>규격</th>
                <th>재고</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(data.items)}">
                <td colspan="7" class="p-4">등록된 품목 정보가 없습니다.</td>
            </tr>
            <tr th:each="item : ${data.items}">
                <td>
                    <input type="checkbox"
                           class="check-item"
                           th:value="${item.id}"/>
                </td>
                <td th:text="${item.code}"></td>
                <td th:text="${item.name}"></td>
                <td th:text="${item.type?.description}"></td>
                <td th:text="${@format.value(item.category.name)}"></td>
                <td th:text="${@format.value(item.specification)}"></td>
                <td th:text="|${#numbers.formatDecimal(item.stock, 1, 'COMMA', item.uom.scale, 'POINT')} ${item.uom.code}|"
                    th:classappend="${item.stock.signum() <= 0} ? 'text-danger'"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!--/* 페이지네이션 */-->
    <div th:replace="~{fragments/pagination :: pagination (${data.pagination})}"></div>
</th:block>

</html>
