<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!--/* 코드 등록 모달 */-->
<th:block th:fragment="new (codeGroup)">
    <div class="modal fade"
         id="create-code-modal"
         tabindex="-1"
         aria-labelledby="create-code-modal-label"
         aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5 fw-bold"
                        id="create-code-modal-label">
                        코드 등록
                    </h1>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>
                </div>
                <div class="modal-body">
                    <form id="create-code-form"
                          method="post"
                          th:action="@{/code-groups/{groupId}/codes(groupId=${codeGroup.id})}">
                        <table class="app-table-input">
                            <colgroup>
                                <col style="width: 150px">
                                <col style="width: auto">
                            </colgroup>
                            <tbody>
                            <tr>
                                <th>
                                    <label for="new-code">
                                        코드 <span class="app-required">*</span>
                                    </label>
                                </th>
                                <td>
                                    <input type="text"
                                           id="new-code"
                                           name="code"
                                           class="app-form-control app-xs"
                                           placeholder="코드를 입력해 주세요."/>
                                </td>
                            </tr>
                            <tr>
                                <th>
                                    <label for="new-name">
                                        코드명 <span class="app-required">*</span>
                                    </label>
                                </th>
                                <td>
                                    <input type="text"
                                           id="new-name"
                                           name="name"
                                           class="app-form-control app-xs"
                                           placeholder="코드명을 입력해 주세요."/>
                                </td>
                            </tr>
                            <tr>
                                <th>
                                    <label for="new-description">코드 설명</label>
                                </th>
                                <td>
                                    <input type="text"
                                           id="new-description"
                                           name="description"
                                           class="app-form-control app-xs"/>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary btn-sm"
                            data-bs-dismiss="modal">
                        취소
                    </button>
                    <button type="submit"
                            form="create-code-form"
                            class="btn btn-primary btn-sm">
                        저장
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            $('#create-code-form').validate({
                rules: {
                    code: {
                        required: true,
                        remote: {
                            url: '/common-codes/check-code',
                            type: 'get',
                            data: {
                                id: function () {
                                    return $('#form-id').val();
                                }
                            }
                        },
                    },
                    name: 'required',
                }, messages: {
                    code: {
                        required: '코드를 입력해 주세요.',
                        remote: '이미 존재하는 코드 입니다.',
                    },
                    name: '코드명을 입력해 주세요.',
                }
            });
        });
    </script>
</th:block>

<!--/* 코드 수정 모달 */-->
<th:block th:fragment="edit (codeGroup)">
    <div class="modal fade"
         id="edit-code-modal"
         tabindex="-1"
         aria-labelledby="edit-code-modal-label"
         aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5 fw-bold"
                        id="edit-code-modal-label">
                        코드 수정
                    </h1>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>
                </div>
                <div class="modal-body">
                    <form id="edit-code-form" method="post">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>
                        <table class="app-table-input">
                            <colgroup>
                                <col style="width: 150px">
                                <col style="width: auto">
                            </colgroup>
                            <tbody>
                            <tr>
                                <th>
                                    <label for="edit-code">
                                        코드 <span class="app-required">*</span>
                                    </label>
                                </th>
                                <td>
                                    <input type="text"
                                           id="edit-code"
                                           name="code"
                                           class="app-form-control app-xs"
                                           placeholder="코드를 입력해 주세요."/>
                                    <input type="hidden"
                                           id="id"
                                           name="id"/>
                                </td>
                            </tr>
                            <tr>
                                <th>
                                    <label for="edit-name">
                                        코드명 <span class="app-required">*</span>
                                    </label>
                                </th>
                                <td>
                                    <input type="text"
                                           id="edit-name"
                                           name="name"
                                           class="app-form-control app-xs"
                                           placeholder="권한 이름을 입력해 주세요."/>
                                </td>
                            </tr>
                            <tr>
                                <th>
                                    <label for="edit-description">코드 설명</label>
                                </th>
                                <td>
                                    <input type="text"
                                           id="edit-description"
                                           name="description"
                                           class="app-form-control app-xs"/>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-secondary btn-sm"
                            data-bs-dismiss="modal">
                        취소
                    </button>
                    <button type="submit"
                            form="edit-code-form"
                            class="btn btn-primary btn-sm">
                        저장
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            $('#edit-code-form').validate({
                rules: {
                    code: {
                        required: true,
                        remote: {
                            url: '/common-codes/check-code',
                            type: 'get',
                            data: {
                                id: function () {
                                    return $('#id').val();
                                }
                            }
                        },
                    },
                    name: 'required',
                }, messages: {
                    code: {
                        required: '코드를 입력해 주세요.',
                        remote: '이미 존재하는 코드 입니다.',
                    },
                    name: '코드명을 입력해 주세요.',
                }
            });
        });
    </script>
</th:block>

</html>
