<!-- 콘텐츠 헤더 -->
<!-- navigation 파라미터 전달 시 쉼표를 구분자로 전달 -->
<div class="app-content-header" th:fragment="header (title, navigation)">
    <div>
        <p class="app-title" th:text="${title}"></p>
    </div>
    <div>
        <ol class="app-breadcrumb">
            <li><i class="fa fa-home" aria-hidden="true"></i></li>
            <li th:each="menu : ${#strings.arraySplit(navigation, ',')}" th:text="${menu}"></li>
        </ol>
    </div>
</div>
