<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="list (lot, inventoryTransactions, totalInventoryQuantity)">
    <div class="app-box app-box-bg mt-2">
        <div>
            <div>
                <p class="h5 fw-bold">재고 변동 내역</p>
            </div>
        </div>

        <div id="bom-item-table">
            <table class="app-table-list text-center">
                <colgroup>
                    <col style="width: 180px">
                    <col style="width: 150px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: auto">
                </colgroup>
                <thead>
                <tr>
                    <th>처리 일시</th>
                    <th>변동 유형</th>
                    <th>변동 수량</th>
                    <th>참조</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(inventoryTransactions)}">
                    <td colspan="8" class="p-4">등록된 재고 내역 정보가 없습니다.</td>
                </tr>
                <tr th:each="transaction : ${inventoryTransactions}">
                    <td th:text="${#temporals.format(transaction.transactionAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    <td class="fw-bold"
                        th:classappend="${transaction.type.direction.sign > 0 ? 'text-success' : 'text-danger'}"
                        th:text="${transaction.type?.description}"></td>
                    <td class="fw-bold"
                        th:classappend="${transaction.type.direction.sign > 0 ? 'text-success' : 'text-danger'}"
                        th:text="|${transaction.type.direction.sign > 0 ? '+' : '-'}
                                  ${#numbers.formatDecimal(transaction.quantity, 1, 'COMMA', transaction.item.uom.scale, 'POINT')}
                                  ${transaction.item.uom.code}|"></td>
                    <td>
                        <a th:if="${transaction.referenceType != null && transaction.referenceId != null}"
                           th:href="${transaction.referenceType.getDetailUrl(transaction.referenceId)}"
                           class="btn btn-secondary btn-sm">
                            상세보기
                        </a>
                        <span th:unless="${transaction.referenceType != null && transaction.referenceId != null}">-</span>
                    </td>
                    <td></td>
                </tr>
                <tr>
                    <td></td>
                    <td class="fw-bold pt-3">합계</td>
                    <td class="fw-bold pt-3"
                        th:text="|${#numbers.formatDecimal(totalInventoryQuantity, 1, 'COMMA', lot.item.uom.scale, 'POINT')} ${lot.item.uom.code}|"></td>
                    <td></td>
                    <td></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>

</html>
