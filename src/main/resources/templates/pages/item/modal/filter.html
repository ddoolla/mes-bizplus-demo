<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
>

<div th:fragment="filter (url, itemCategories, itemTypes)">
    <form id="item-search-form" method="GET" th:action="${url}">
        <table class="app-table-input">
            <colgroup>
                <col style="width: 100px">
                <col style="width: auto">
                <col style="width: 100px">
                <col style="width: auto">
                <col style="width: 100px">
                <col style="width: auto">
                <col style="width: 100px">
                <col style="width: auto">
            </colgroup>
            <tbody>
            <tr>
                <th>품목 카테고리</th>
                <td>
                    <select name="categoryId"
                            class="app-form-control app-xs">
                        <option value="">
                            전체
                        </option>
                        <option th:if="${#lists.isEmpty(itemCategories)}" value="" disabled>
                            등록된 카테고리가 없습니다.
                        </option>
                        <option th:each="category : ${itemCategories}"
                                th:value="${category.id}"
                                th:text="${category.name}">
                        </option>
                    </select>
                </td>
                <th>품목 유형</th>
                <td>
                    <select name="type"
                            class="app-form-control app-xs">
                        <option value="">전체</option>
                        <option th:each="type : ${itemTypes}"
                                th:value="${type?.name()}"
                                th:text="${type?.getDescription()}">
                        </option>
                    </select>
                </td>
                <th>품목 코드</th>
                <td>
                    <input type="text"
                           name="code"
                           class="app-form-control app-xs"
                           th:value="${param.code}">
                </td>
                <th>품목명</th>
                <td>
                    <input type="text"
                           name="name"
                           class="app-form-control app-xs"
                           th:value="${param.name}">
                </td>
            </tr>
            </tbody>
        </table>

        <div class="mt-2 text-end">
            <button type="submit" class="btn btn-secondary btn-sm">
                <i class="fa fa-search" aria-hidden="true"></i> 조회
            </button>
        </div>
    </form>
</div>

</html>
