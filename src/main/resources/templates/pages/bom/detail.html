<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('BOM 상세', ~{}, ~{}, 'BOM', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('BOM 상세', '기준정보관리, BOM관리, 상세')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/boms}'|">
            <i class="fa fa-arrow-left" aria-hidden="true"></i> 목록
        </button>

        <button type="button"
                class="btn btn-primary btn-sm"
                sec:authorize="hasAuthority('BOM_UPDATE')"
                th:onclick="|location.href='@{/boms/{id}/edit(id=${bom.id})}'|">
            <i class="fa fa-pencil" aria-hidden="true"></i> 수정
        </button>
    </div>

    <!--/* BOM 상세 */-->
    <div class="app-box app-box-bg">
        <table class="app-table-input" th:object="${bom}">
            <colgroup>
                <col style="width: 150px">
                <col style="width: auto">
            </colgroup>
            <tbody>
            <tr>
                <th>제품</th>
                <td th:text="*{item.name}"></td>
            </tr>
            <tr>
                <th>BOM 코드</th>
                <td th:text="*{code}"></td>
            </tr>
            <tr>
                <th>BOM명</th>
                <td th:text="*{name}"></td>
            </tr>
            <tr>
                <th>버전</th>
                <td th:text="${@format.value(bom.version)}"></td>
            </tr>
            <tr>
                <th>기본 BOM 여부</th>
                <td th:text="${bom.primary ? '예' : '아니오'}"></td>
            </tr>
            <tr>
                <th>비고</th>
                <td th:text="${@format.value(bom.remark)}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!--/* BOM 구성 품목 */-->
    <div th:replace="~{pages/bom-item/fragments/list :: list (${bomItems})}"></div>
</div>
</body>
</html>
