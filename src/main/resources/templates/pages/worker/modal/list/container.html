<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!--/* 작업자 목록 모달 */-->
<th:block th:fragment="container (url, departments, positions)">
    <div th:replace="~{fragments/modal/default :: default (
        'worker-list-modal',
        '작업자 목록',
         ~{::content},
         1200
    )}">
        <div th:fragment="content" class="p-2">
            <div class="modal-body pt-0 app-modal-body">
                <!--/* 검색 필터 */-->
                <div th:replace="~{pages/worker/modal/list/filter :: filter (
                    ${url},
                    ${departments},
                    ${positions} )}">
                </div>

                <!--/* 설비 목록 */-->
                <div class="worker-list"></div>
            </div>
        </div>
    </div>
</th:block>

</html>
