<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<div th:fragment="filter (url, inspectionTypes, count)">
    <form method="GET" th:action="${url}">
        <table class="app-table-input">
            <colgroup>
                <col style="width: 120px">
                <col style="width: auto">
                <col style="width: 120px">
                <col style="width: auto">
                <col style="width: 120px">
                <col style="width: auto">
            </colgroup>
            <tbody>
            <tr>
                <th>검사기준</th>
                <td>
                    <input type="text"
                           name="spec"
                           class="app-form-control app-xs"
                           th:value="${param.spec}">
                </td>
                <th>검사 유형</th>
                <td>
                    <select name="type"
                            class="app-form-control app-xs"
                            th:value="${param.type}">
                        <option value="">전체</option>
                        <option th:each="type : ${inspectionTypes}"
                                th:value="${type}"
                                th:text="${type?.description}"
                                th:selected="${#strings.equals(param.type, type.name)}"></option>
                    </select>
                </td>
                <th>품목</th>
                <td>
                    <input type="text"
                           name="item"
                           class="app-form-control app-xs"
                           th:value="${param.item}">
                </td>
            </tr>
            </tbody>
        </table>

        <div class="mt-2 mb-2 text-end">
            <button type="submit" class="btn btn-secondary btn-sm">
                <i class="bi bi-search"></i> 조회
            </button>
        </div>

        <div class="d-flex justify-content-between mb-2">
            <div class="fw-bold"
                 th:text="|Total : ${count} 건|">
            </div>
            <div>
                <button type="button"
                        class="btn btn-primary btn-sm"
                        th:onclick="|location.href='@{/inspection-specs/new}'|"
                        sec:authorize="hasAuthority('INSPECTION_SPEC_CREATE')">
                    <i class="bi bi-plus-circle"></i> 등록
                </button>
                <button type="button"
                        id="inspection-spec-delete-button"
                        class="btn btn-danger btn-sm"
                        sec:authorize="hasAuthority('INSPECTION_SPEC_DELETE')">
                    <i class="bi bi-trash"></i> 삭제
                </button>
            </div>
        </div>
    </form>
</div>

</html>
