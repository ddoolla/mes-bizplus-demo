<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('검사기준 등록', ~{}, ~{::script}, 'INSPECTION_SPEC', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script type="module" th:src="@{/js/pages/inspection-spec/new.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('검사기준 등록', '기준정보관리, 검사기준관리, 등록')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/inspection-specs}'|">
            <i class="bi bi-x-circle"></i> 취소
        </button>

        <button type="submit"
                form="inspection-spec-create-form"
                class="btn btn-primary btn-sm"
                sec:authorize="hasAuthority('INSPECTION_SPEC_CREATE')">
            <i class="bi bi-floppy"></i> 저장
        </button>
    </div>

    <!--/* 등록 양식 */-->
    <div class="app-box app-box-bg">
        <form id="inspection-spec-create-form" method="post" th:action="@{/inspection-specs}">
            <table class="app-table-input">
                <colgroup>
                    <col style="width: 150px">
                    <col style="width: auto">
                </colgroup>
                <tbody>
                <tr>
                    <th>검사 유형 <span class="app-required">*</span></th>
                    <td>
                        <select name="type"
                                class="app-form-control app-xs">
                            <option value="">선택</option>
                            <option th:each="type : ${inspectionTypes}"
                                    th:value="${type}"
                                    th:text="${type?.description}">
                            </option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>품목 <span class="app-required">*</span></th>
                    <td>
                        <input type="text"
                               name="itemName"
                               class="app-form-control app-xs app-readonly-bg w-25"
                               placeholder="품목을 선택해 주세요."
                               readonly/>
                        <input type="hidden" name="itemId"/>
                        <button type="button"
                                id="item-list-button"
                                class="btn btn-secondary app-btn-xs">
                            <i class="bi bi-list"></i> 품목 목록
                        </button>
                        <div id="item-error-container"></div>
                    </td>
                </tr>
                <tr>
                    <th>공정 <span class="app-required">*</span></th>
                    <td>
                        <input type="text"
                               name="processName"
                               class="app-form-control app-xs app-readonly-bg w-25"
                               placeholder="공정검사 선택 시 공정을 선택할 수 있습니다."
                               readonly/>
                        <input type="hidden" name="processId"/>
                        <button type="button"
                                id="process-list-button"
                                class="btn btn-secondary app-btn-xs"
                                disabled>
                            <i class="bi bi-list"></i> 공정 목록
                        </button>
                        <div id="process-error-container"></div>
                    </td>
                </tr>
                <tr>
                    <th>검사기준 코드 <span class="app-required">*</span></th>
                    <td>
                        <input type="text"
                               name="code"
                               class="app-form-control app-xs"
                               placeholder="검사기준 코드를 입력해 주세요."/>
                    </td>
                </tr>
                <tr>
                    <th>검사기준명 <span class="app-required">*</span></th>
                    <td>
                        <input type="text"
                               name="name"
                               class="app-form-control app-xs"
                               placeholder="검사기준명을 입력해 주세요."/>
                    </td>
                </tr>
                <tr>
                    <th>버전</th>
                    <td>
                        <input type="text"
                               name="version"
                               class="app-form-control app-xs"/>
                    </td>
                </tr>
                <tr>
                    <th>기본 검사기준</th>
                    <td>
                        <label>
                            <input type="checkbox"
                                   name="primary"
                                   value="true"
                                   class="app-form-control app-xs"/>
                            기본 검사기준으로 사용
                        </label>
                    </td>
                </tr>
                <tr>
                    <th>비고</th>
                    <td>
                        <input type="text"
                               name="remark"
                               class="app-form-control app-xs"/>
                    </td>
                </tr>
                </tbody>
            </table>
        </form>
    </div>

    <!--/* 제품 선택 모달 */-->
    <div th:replace="~{pages/item/modal/list/container :: container (
        @{/items/modal/list/single},
        '',
        ${itemCategories},
        ${itemTypes})}">
    </div>

    <!--/* 공정 선택 모달 */-->
    <div th:replace="~{pages/process/modal/list/container :: container (
        @{/processes/modal/list/single})}">
    </div>
</div>
</body>
</html>
