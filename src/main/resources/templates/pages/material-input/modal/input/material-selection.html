<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!--/* 투입 대상 자재 목록 모달 */-->
<th:block th:fragment="modal (workOrder, availableMaterials)">
    <div th:replace="~{fragments/modal/default :: default (
        'material-selection-modal',
        '투입 대상 자재 목록',
         ~{::content},
         1200
    )}">
        <div th:fragment="content" class="p-2">

            <input type="hidden" name="workOrderId" th:value="${workOrder.id}"/>

            <div class="modal-body pt-0">
                <div class="d-flex justify-content-start">
                    <div class="fw-bold"
                         th:text="|Total : ${availableMaterials.size()} 건|">
                    </div>
                </div>
                <div>
                    <table class="app-table-list text-center">
                        <colgroup>
                            <col style="width: 200px">
                            <col style="width: 200px">
                            <col style="width: auto">
                            <col style="width: 150px">
                            <col style="width: 150px">
                            <col style="width: 150px">
                            <col style="width: 150px">
                            <col style="width: 100px">
                        </colgroup>
                        <thead>
                        <tr>
                            <th>자재 코드</th>
                            <th>자재명</th>
                            <th>규격</th>
                            <th>요구 수량</th>
                            <th>투입 수량</th>
                            <th>남은 수량</th>
                            <th>초과 수량</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(availableMaterials)}">
                            <td colspan="8" class="p-4">등록된 소모 자재 정보가 없습니다.</td>
                        </tr>
                        <tr th:each="am : ${availableMaterials}">
                            <td th:text="${am.item.code}"></td>
                            <td th:text="${am.item.name}"></td>
                            <td th:text="${@format.value(am.item.specification)}"></td>
                            <td th:text="|${#numbers.formatDecimal(am.requiredQuantity, 1, 'COMMA', am.uom.scale, 'POINT')} ${am.uom.code}|"></td>
                            <td th:text="|${#numbers.formatDecimal(am.inputQuantity, 1, 'COMMA', am.uom.scale, 'POINT')} ${am.uom.code}|"></td>
                            <td th:text="|${#numbers.formatDecimal(am.remainingQuantity, 1, 'COMMA', am.uom.scale, 'POINT')} ${am.uom.code}|"></td>
                            <td th:text="|${#numbers.formatDecimal(am.excessQuantity, 1, 'COMMA', am.uom.scale, 'POINT')} ${am.uom.code}|"></td>
                            <td>
                                <button type="button"
                                        class="material-select-button
                                   btn btn-primary btn-sm"
                                        th:data-item-id="${am.item.id}"
                                        th:data-item-code="${am.item.code}"
                                        th:data-item-name="${am.item.name}"
                                        th:data-item-spec="${am.item.specification}"
                                        th:data-lot-managed="${am.item.lotManaged}"
                                        th:data-uom-id="${am.uom.id}"
                                        th:data-uom-code="${am.uom.code}"
                                        th:data-required-quantity="${am.requiredQuantity.intValue()}"
                                        th:data-input-quantity="${am.inputQuantity.intValue()}"
                                        th:data-remaining-quantity="${am.remainingQuantity.intValue()}"
                                        th:data-excess-quantity="${am.excessQuantity.intValue()}">
                                    선택
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</th:block>

</html>
