<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="list (inspectionResults)">
    <div class="app-box app-box-bg mt-2">
        <div>
            <div>
                <p class="h5 fw-bold">검사항목</p>
            </div>
        </div>

        <div id="sales-order-item-table">
            <table class="app-table-list text-center">
                <colgroup>
                    <col style="width: 150px">
                    <col style="width: 150px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: 80px">
                    <col style="width: auto">
                </colgroup>
                <thead>
                <tr>
                    <th>검사 그룹</th>
                    <th>검사 항목</th>
                    <th>검사 기준</th>
                    <th>검사 방법</th>
                    <th>비고</th>
                    <th>측정 값</th>
                    <th>판정</th>
                    <th>특이사항</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(inspectionResults)}">
                    <td colspan="8" class="p-4">등록된 검사항목 정보가 없습니다.</td>
                </tr>
                <tr th:each="result : ${inspectionResults}">
                    <td th:text="${@format.value(result.itemGroup)}"></td>
                    <td th:text="${@format.value(result.itemName)}"></td>
                    <td th:text="${@format.value(result.standard)}"></td>
                    <td th:text="${@format.value(result.method)}"></td>
                    <td th:text="${@format.value(result.specRemark)}"></td>
                    <td th:text="${@format.value(result.measuredValue)}"></td>
                    <td th:switch="${result.judgement?.name}">
                        <h6 th:case="'PASS'" class="mb-0">
                            <span class="badge text-bg-success p-2 app-w-50"
                                  th:text="*{result.judgement?.description}"></span>
                        </h6>
                        <h6 th:case="'FAIL'" class="mb-0">
                            <span class="badge text-bg-danger p-2 app-w-50"
                                  th:text="*{result.judgement?.description}"></span>
                        </h6>
                    </td>
                    <td th:text="${@format.value(result.remark)}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>

</html>
