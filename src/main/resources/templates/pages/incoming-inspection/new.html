<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('입고검사 등록', ~{}, ~{::script}, 'INCOMING_INSPECTION', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script type="module" th:src="@{/js/pages/incoming-inspection/new.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('입고검사 등록', '품질관리, 입고검사, 등록')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/incoming-inspections}'|">
            <i class="bi bi-x-circle"></i> 취소
        </button>

        <button type="submit"
                form="incoming-inspection-new-form"
                class="btn btn-primary btn-sm"
                sec:authorize="hasAuthority('INCOMING_INSPECTION_CREATE')">
            <i class="bi bi-floppy"></i> 저장
        </button>
    </div>

    <!--/* 등록 양식 */-->
    <div class="app-box app-box-bg">
        <form id="incoming-inspection-new-form" method="post" th:action="@{/incoming-inspections}">
            <div>
                <div>
                    <h5 class="fw-bold">입고 정보</h5>
                </div>
                <div>
                    <table class="app-table-input">
                        <colgroup>
                            <col style="width: 150px">
                            <col style="width: auto">
                        </colgroup>
                        <tbody>
                        <tr>
                            <th>입고 번호 <span class="app-required">*</span></th>
                            <td>
                                <input type="text"
                                       name="receiptNo"
                                       class="app-form-control app-xs app-readonly-bg app-w-400"
                                       placeholder="입고 자재를 선택해 주세요."
                                       readonly/>
                                <input type="hidden" name="receiptItemId"/>
                                <button type="button"
                                        id="receipt-item-list-button"
                                        class="btn btn-secondary app-btn-xs">
                                    <i class="bi bi-list"></i> 입고 자재 목록
                                </button>
                                <div id="receipt-item-error-container"></div>
                            </td>
                        </tr>
                        <tr>
                            <th>자재 코드</th>
                            <td>
                                <input type="text"
                                       name="itemCode"
                                       class="app-form-control app-xs app-readonly-bg app-w-400"
                                       readonly/>
                            </td>
                        </tr>
                        <tr>
                            <th>자재명</th>
                            <td>
                                <input type="text"
                                       name="itemName"
                                       class="app-form-control app-xs app-readonly-bg app-w-400"
                                       readonly/>
                            </td>
                        </tr>
                        <tr>
                            <th>LOT</th>
                            <td>
                                <input type="text"
                                       name="lotNo"
                                       class="app-form-control app-xs app-readonly-bg app-w-400"
                                       readonly/>
                            </td>
                        </tr>
                        <tr>
                            <th>입고 수량</th>
                            <td>
                                <input type="text"
                                       name="receiptQuantity"
                                       class="app-form-control app-xs app-readonly-bg app-w-400"
                                       readonly/>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="mt-3">
                <div>
                    <h5 class="fw-bold">검사 정보</h5>
                </div>
                <div>
                    <table class="app-table-input">
                        <colgroup>
                            <col style="width: 150px">
                            <col style="width: auto">
                        </colgroup>
                        <tbody>
                        <tr>
                            <th>검사 기준 <span class="app-required">*</span></th>
                            <td>
                                <input type="text"
                                       name="inspectionSpecName"
                                       class="app-form-control app-xs app-readonly-bg app-w-400"
                                       placeholder="검사 기준을 선택해 주세요."
                                       readonly/>
                                <input type="hidden" name="inspectionSpecId"/>
                                <button type="button"
                                        id="inspection-spec-list-button"
                                        class="btn btn-secondary app-btn-xs">
                                    <i class="bi bi-list"></i> 검사기준 목록
                                </button>
                                <div id="inspection-spec-error-container"></div>
                            </td>
                        </tr>
                        <tr>
                            <th>검사일 <span class="app-required">*</span></th>
                            <td>
                                <input type="text"
                                       name="date"
                                       class="app-form-control app-xs"
                                       th:value="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}"
                                       readonly/>
                            </td>
                        </tr>
                        <tr>
                            <th>검사 수량 <span class="app-required">*</span></th>
                            <td>
                                <input type="number"
                                       name="quantity"
                                       class="app-form-control app-xs"/>
                            </td>
                        </tr>
                        <tr>
                            <th>검사 단위 <span class="app-required">*</span></th>
                            <td>
                                <select name="uomId"
                                        class="app-form-control app-xs"
                                        disabled>
                                    <option value="">입고 자재를 선택해 주세요.</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <th>비고</th>
                            <td>
                                <input type="text"
                                       name="remark"
                                       class="app-form-control app-xs"/>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </form>
    </div>

    <!--/* 입고 자재 목록 모달 */-->
    <div th:replace="~{pages/receipt-item/modal/select :: modal}"></div>

    <!--/* 검사기준 목록 모달 */-->
    <div th:replace="~{pages/inspection-spec/modal/select :: modal}"></div>
</div>
</body>
</html>
