<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('수주 상세', ~{}, ~{::script}, 'SALES_ORDER', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script type="module" th:src="@{/js/pages/sales-order/detail.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('수주 상세', '수주관리, 수주현황, 상세')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/sales-orders}'|">
            <i class="bi bi-list"></i> 목록
        </button>

        <button type="button"
                class="btn btn-primary btn-sm"
                th:onclick="|location.href='@{/sales-orders/{id}/edit(id=${salesOrder.id})}'|"
                sec:authorize="hasAuthority('SALES_ORDER_UPDATE')">
            <i class="bi bi-pencil-square"></i> 수정
        </button>
        <button th:if="${salesOrder.status?.name == 'DRAFT'}"
                type="button"
                id="sales-order-confirm-button"
                class="btn btn-success btn-sm"
                th:data-id="${salesOrder.id}"
                sec:authorize="hasAuthority('SALES_ORDER_UPDATE')">
            <i class="bi bi-check-circle"></i> 확정
        </button>
    </div>

    <!--/* 상세 정보 */-->
    <div class="app-box app-box-bg">

        <table class="app-table-input" th:object="${salesOrder}">
            <colgroup>
                <col style="width: 150px">
                <col style="width: auto">
            </colgroup>
            <tbody>
            <tr>
                <th>수주 번호</th>
                <td th:text="*{orderNo}"></td>
            </tr>
            <tr>
                <th>거래처</th>
                <td th:text="*{partner.name}"></td>
            </tr>
            <tr>
                <th>등록일</th>
                <td th:text="${#temporals.format(salesOrder.date, 'yyyy-MM-dd')}"></td>
            </tr>
            <tr>
                <th>납기일</th>
                <td th:text="${#temporals.format(salesOrder.dueDate, 'yyyy-MM-dd')}"></td>
            </tr>
            <tr>
                <th>비고</th>
                <td th:text="${@format.value(salesOrder.remark)}"></td>
            </tr>
            <tr>
                <th>상태</th>
                <td th:switch="${salesOrder.status.name}">
                        <h6 th:case="'DRAFT'" class="mb-0">
                            <span class="badge text-bg-secondary p-2"
                                  th:text="${salesOrder.status?.description}"></span>
                        </h6>
                        <h6 th:case="'CONFIRMED'" class="mb-0">
                            <span class="badge text-bg-primary p-2"
                                  th:text="${salesOrder.status?.description}"></span>
                        </h6>
                        <h6 th:case="'COMPLETED'" class="mb-0">
                            <span class="badge text-bg-success p-2"
                                  th:text="${salesOrder.status?.description}"></span>
                        </h6>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!--/* 수주 품목 정보 */-->
    <div th:replace="~{pages/sales-order-item/fragments/list :: list (${salesOrderItems})}"></div>
</div>
</body>
</html>
