<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('공정 단계 상세', ~{}, ~{::script}, 'ROUTING', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script type="module" th:src="@{/js/pages/routing-process/detail.js}"></script>
    <script type="module" th:src="@{/js/pages/process-material/form.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('공정 단계 상세', '기준정보관리, 제품공정관리, 상세, 수정, 공정상세')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="app-action-bar">
        <!--/* 서브 타이틀 */-->
        <div class="d-flex align-items-center">
            <span class="fw-bold fs-5"
                  th:text="${routing.item.name}"></span>
        </div>
        <!--/* 버튼 */-->
        <div class="d-flex gap-2">
            <button type="button"
                    class="btn btn-secondary btn-sm"
                    th:onclick="|location.href='@{/routings/{id}/edit(id=${routing.id})}'|">
                <i class="bi bi-arrow-left"></i> 돌아가기
            </button>
            <button type="submit"
                    class="btn btn-primary btn-sm"
                    form="process-material-edit-form"
                    sec:authorize="hasAuthority('ROUTING_UPDATE')">
                <i class="bi bi-floppy"></i> 저장
            </button>
        </div>
    </div>

    <form id="process-material-edit-form"
          method="post"
          th:action="@{/routings/{routingId}/processes/{routingProcessId}(routingId=${routing.id}, routingProcessId=${routingProcess.id})}"
          th:object="${routingProcess}">

        <input type="hidden" name="itemGroup" th:value="${itemGroup}"/>
        <input type="hidden" name="itemId" th:value="${param.itemId}"/>
        <input type="hidden" name="processId" th:value="*{process.id}"/>

        <!--/* 공정 단계 정보 */-->
        <div class="app-box app-box-bg">
            <table class="app-table-input">
                <colgroup>
                    <col style="width: 150px">
                    <col style="width: auto">
                </colgroup>
                <tbody>
                <tr>
                    <th>공정 코드</th>
                    <td th:text="*{process.code}"></td>
                </tr>
                <tr>
                    <th>공정명</th>
                    <td th:text="*{process.name}"></td>
                </tr>
                <tr>
                    <th>검사 대상 여부</th>
                    <td>
                        <label>
                            <input type="radio"
                                   name="processInspectionRequired"
                                   value="true"
                                   th:checked="*{processInspectionRequired}"/>
                            예
                        </label>
                        &nbsp;&nbsp;
                        <label>
                            <input type="radio"
                                   name="processInspectionRequired"
                                   value="false"
                                   th:checked="*{!processInspectionRequired}"/>
                            아니오
                        </label>
                    </td>
                </tr>
                <tr>
                    <th>기본 검사기준</th>
                    <td>
                        <input type="text"
                               name="inspectionSpecName"
                               class="app-form-control app-xs app-readonly-bg app-w-400"
                               th:value="*{defaultIpqcSpec.name}"
                               placeholder="검사기준을 선택해 주세요."
                               readonly/>
                        <input type="hidden"
                               name="inspectionSpecId"
                               th:value="*{defaultIpqcSpec.id}"/>
                        <button type="button"
                                id="inspection-spec-list-button"
                                class="btn btn-secondary app-btn-xs">
                            <i class="bi bi-list"></i> 검사기준 목록
                        </button>
                    </td>
                </tr>
                <tr>
                    <th>공정 단계</th>
                    <td th:text="*{stepNo}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <!--/* 공정 소모 자재 목록 */-->
        <div th:replace="~{pages/process-material/fragments/form :: form (
            ${routing},
            ${routingProcess},
            ${processMaterialData})}">
        </div>
    </form>

    <!--/* 자재에서 추가 모달 */-->
    <div th:replace="~{pages/item/modal/multi-select :: modal (
        @{/items/modal/multi-select/list},
        ${itemGroup},
        ${itemCategories},
        ${itemTypes})}">
    </div>

    <!--/* BOM에서 추가 모달 */-->
    <div th:replace="~{pages/bom-item/modal/list/container :: container (
         @{/bom-items/modal/list/multiple},
         ${boms})}">
    </div>

    <!--/* 검사기준 목록 모달 */-->
    <div th:replace="~{pages/inspection-spec/modal/select :: modal}"></div>
</div>
</body>
</html>
