<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="form (salesOrder, salesOrderItems)">
    <div class="app-box app-box-bg mt-2">
        <div class="d-flex justify-content-between">
            <div>
                <p class="h5 fw-bold">수주 품목</p>
            </div>
            <div>
                <th:block th:if="${salesOrder.status.name == 'DRAFT'}">
                    <button type="button"
                            id="sales-order-item-create-button"
                            class="btn btn-primary btn-sm me-1">
                        <i class="bi bi-plus-circle"></i> 추가
                    </button>
                    <button type="button"
                            id="sales-order-item-delete-button"
                            class="btn btn-danger btn-sm">
                        <i class="bi bi-trash"></i> 삭제
                    </button>
                </th:block>
            </div>
        </div>

        <div id="sales-order-item-table">
            <table class="app-table-list text-center">
                <colgroup>
                    <col style="width: 50px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: 100px">
                    <col style="width: 100px">
                    <col style="width: 150px">
                    <col style="width: 150px">
                    <col style="width: auto">
                    <col style="width: 150px">
                </colgroup>
                <thead>
                <tr>
                    <th>
                        <input type="checkbox"
                               class="check-all"
                               th:disabled="${salesOrder.status?.name != 'DRAFT'}">
                    </th>
                    <th>코드</th>
                    <th>품목명</th>
                    <th>규격</th>
                    <th>수주 수량</th>
                    <th>단위</th>
                    <th>단가</th>
                    <th>금액</th>
                    <th>비고</th>
                    <th>상태</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(salesOrderItems)}">
                    <td colspan="10" class="p-4">등록된 수주 품목 정보가 없습니다.</td>
                </tr>
                <tr th:each="salesOrderItem, stat : ${salesOrderItems}">

                    <input type="hidden"
                           th:name="|salesOrderItems[${stat.index}].id|"
                           th:value="${salesOrderItem.id}"/>

                    <td>
                        <input type="checkbox"
                               class="check-item"
                               th:value="${salesOrderItem.id}"
                               th:disabled="${salesOrder.status?.name != 'DRAFT'}"/>
                    </td>
                    <td th:text="${salesOrderItem.item.code}"></td>
                    <td th:text="${salesOrderItem.item.name}"></td>
                    <td th:text="${@format.value(salesOrderItem.item.specification)}"></td>
                    <td>
                        <input type="number"
                               th:name="|salesOrderItems[${stat.index}].quantity|"
                               class="sales-order-item-quantity
                                      app-form-control app-xs "
                               th:value="${#numbers.formatDecimal(salesOrderItem.quantity, 1, salesOrderItem.uom.scale)}"
                               th:disabled="${salesOrder.status?.name != 'DRAFT'}" min="0"/>
                    </td>
                    <td th:text="${salesOrderItem.uom.code}"></td>
                    <td>
                        <input type="number"
                               th:name="|salesOrderItems[${stat.index}].unitPrice|"
                               class="sales-order-item-unit-price
                                      app-form-control app-xs "
                               th:value="${#numbers.formatDecimal(salesOrderItem.unitPrice, 1, 2)}"
                               th:disabled="${salesOrder.status?.name != 'DRAFT'}" min="0"/>
                    </td>
                    <td>
                        <span class="sales-order-item-amount"
                              th:text="${#numbers.formatDecimal(salesOrderItem.amount, 1, 'COMMA', 0, 'POINT')} ?: '-'"></span>
                    </td>
                    <td>
                        <input type="text"
                               th:name="|salesOrderItems[${stat.index}].remark|"
                               class="app-form-control app-xs"
                               th:value="${salesOrderItem.remark}"/>
                    </td>
                    <td th:switch="${salesOrderItem.status.name}">
                        <h6 th:case="'NOT_SHIPPED'" class="mb-0">
                            <span class="badge text-bg-secondary p-2 app-w-80"
                                  th:text="${salesOrderItem.status?.description}"></span>
                        </h6>
                        <h6 th:case="'PARTIALLY_SHIPPED'" class="mb-0">
                            <span class="badge text-bg-primary p-2 app-w-80"
                                  th:text="${salesOrderItem.status?.description}"></span>
                        </h6>
                        <h6 th:case="'SHIPPED'" class="mb-0">
                            <span class="badge text-bg-success p-2 app-w-80"
                                  th:text="${salesOrderItem.status?.description}"></span>
                        </h6>
                    </td>
                </tr>
                <tr th:unless="${#lists.isEmpty(salesOrderItems)}">
                    <td colspan="6"></td>
                    <td class="pt-3 fw-bold">합계</td>
                    <td class="pt-3 fw-bold total-amount"></td>
                    <td colspan="2"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>

</html>
