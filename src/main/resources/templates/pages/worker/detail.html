<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('작업자 상세', ~{}, ~{}, 'WORKER', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('작업자 상세', '기준정보관리, 작업자관리, 상세')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/workers}'|">
            <i class="bi bi-list"></i> 목록
        </button>

        <button type="button"
                class="btn btn-primary btn-sm"
                th:onclick="|location.href='@{/workers/{id}/edit(id=${worker.id})}'|"
                sec:authorize="hasAuthority('WORKER_UPDATE')">
            <i class="bi bi-pencil-square"></i> 수정
        </button>
    </div>

    <!--/* 상세 정보 */-->
    <div class="app-box app-box-bg">

        <table class="app-table-input" th:object="${worker}">
            <colgroup>
                <col style="width: 150px">
                <col style="width: auto">
            </colgroup>
            <tbody>
            <tr>
                <th>작업자 코드</th>
                <td th:text="*{code}"></td>
            </tr>
            <tr>
                <th>작업자명</th>
                <td th:text="*{user.name}"></td>
            </tr>
            <tr>
                <th>부서</th>
                <td th:text="${@format.value(worker.user.department)}"></td>
            </tr>
            <tr>
                <th>직책</th>
                <td th:text="${@format.value(worker.user.position)}"></td>
            </tr>
            <tr>
                <th>휴대폰 번호</th>
                <td th:text="${@format.phoneNo(worker.user.phone)}"></td>
            </tr>
            <tr>
                <th>이메일</th>
                <td th:text="${@format.value(worker.user.email)}"></td>
            </tr>
            <tr>
                <th>비고</th>
                <td th:text="${@format.value(worker.remark)}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
