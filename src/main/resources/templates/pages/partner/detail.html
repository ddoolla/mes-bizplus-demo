<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('거래처 상세', ~{}, ~{}, 'PARTNER', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('거래처 상세', '기준정보관리, 거래처관리, 상세')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/partners}'|">
            <i class="bi bi-list"></i> 목록
        </button>

        <button type="button"
                class="btn btn-primary btn-sm"
                sec:authorize="hasAuthority('PARTNER_UPDATE')"
                th:onclick="|location.href='@{/partners/{id}/edit(id=${partner.id})}'|">
            <i class="bi bi-pencil-square"></i> 수정
        </button>
    </div>

    <!--/* 거래처 목록 */-->
    <div class="app-box app-box-bg">
        <table class="app-table-input" th:object="${partner}">
            <colgroup>
                <col style="width: 120px">
                <col style="width: 300px">
                <col style="width: 120px">
                <col style="width: auto">
            </colgroup>
            <tbody>
            <tr>
                <th>거래처 코드</th>
                <td th:text="*{code}"></td>
                <th>거래처 유형</th>
                <td th:text="*{type?.description}"></td>
            </tr>
            <tr>
                <th>거래처명</th>
                <td th:text="*{name}"></td>
                <th>대표자명</th>
                <td th:text="${@format.value(partner.ceoName)}"></td>
            </tr>
            <tr>
                <th>사업자등록번호</th>
                <td th:text="${@format.businessNo(partner.businessNo)}"></td>
                <th>법인등록번호</th>
                <td th:text="${@format.corporateNo(partner.corporateNo)}"></td>
            </tr>
            <tr>
                <th>전화번호</th>
                <td th:text="${@format.value(partner.tel)}"></td>
                <th>팩스번호</th>
                <td th:text="${@format.value(partner.fax)}"></td>
            </tr>
            <tr>
                <th>이메일</th>
                <td th:text="${@format.value(partner.email)}"></td>
                <th>홈페이지</th>
                <td th:text="${@format.value(partner.homePage)}"></td>
            </tr>
            <tr>
                <th rowspan="3">주소</th>
                <td colspan="3" th:text="${@format.value(partner.zipCode)}"></td>
            </tr>
            <tr>
                <td colspan="3" th:text="${@format.value(partner.address)}"></td>
            </tr>
            <tr>
                <td colspan="3" th:text="${@format.value(partner.addressDetail)}"></td>
            </tr>
            <tr>
                <th>비고</th>
                <td colspan="3" th:text="${@format.value(partner.remark)}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!--/* 거래처 담당자 목록 */-->
    <div th:replace="~{pages/partner-contact/fragments/list :: list (${partnerContacts})}"></div>
</div>
</body>
</html>
