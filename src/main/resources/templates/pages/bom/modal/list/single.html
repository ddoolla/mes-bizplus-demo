<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="list">
    <div class="d-flex justify-content-start">
        <div class="fw-bold"
             th:text="|Total : ${boms.size()} 건|">
        </div>
    </div>
    <div id="item-table">
        <table class="app-table-list text-center">
            <colgroup>
                <col style="width: 200px">
                <col style="width: 200px">
                <col style="width: 100px">
                <col style="width: 100px">
            </colgroup>
            <thead>
            <tr>
                <th>코드</th>
                <th>BOM명</th>
                <th>버전</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(boms)}">
                <td colspan="5" class="p-4">등록된 BOM 정보가 없습니다.</td>
            </tr>
            <tr th:each="bom : ${boms}">
                <td th:text="${bom.code}"></td>
                <td th:text="${bom.name}"></td>
                <td th:text="${@format.value(bom.version)}"></td>
                <td>
                    <button type="button"
                            class="bom-select-button
                                   btn btn-primary btn-sm"
                            th:data-id="${bom.id}"
                            th:data-name="${bom.name}">
                        선택
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>

</html>
