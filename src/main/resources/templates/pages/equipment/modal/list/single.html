<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="list">
    <div class="d-flex justify-content-start">
        <div class="fw-bold"
             th:text="|Total : ${data.pagination.totalElements} 건|">
        </div>
    </div>
    <div id="equipment-table">
        <table class="app-table-list text-center">
            <colgroup>
                <col style="width: 200px">
                <col style="width: 200px">
                <col style="width: 200px">
                <col style="width: auto">
                <col style="width: 100px">
            </colgroup>
            <thead>
            <tr>
                <th>설비 코드</th>
                <th>설비명</th>
                <th>설비 유형</th>
                <th>위치</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(data.equipments)}">
                <td colspan="4" class="p-4">등록된 설비 정보가 없습니다.</td>
            </tr>
            <tr th:each="equipment : ${data.equipments}">
                <td th:text="${equipment.code}"></td>
                <td th:text="${equipment.name}"></td>
                <td th:text="${@format.nameWithCode(equipment.type.code, equipment.type.name)}"></td>
                <td th:text="${@format.value(equipment.location)}"></td>
                <td>
                    <button type="button"
                            class="equipment-select-button
                                   btn btn-primary btn-sm"
                            th:data-id="${equipment.id}"
                            th:data-name="${equipment.name}">
                        선택
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!--/* 페이지네이션 */-->
    <div th:replace="~{fragments/pagination :: pagination (${data.pagination})}"></div>
</th:block>

</html>
