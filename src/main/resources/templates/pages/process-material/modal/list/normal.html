<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="list">
    <div class="d-flex justify-content-start">
        <div class="fw-bold"
             th:text="|Total : ${processMaterials.size()} 건|">
        </div>
    </div>
    <div id="process-material-table">
        <table class="app-table-list text-center">
            <colgroup>
                <col style="width: 200px">
                <col style="width: 200px">
                <col style="width: 150px">
                <col style="width: auto">
                <col style="width: 150px">
                <col style="width: 150px">
            </colgroup>
            <thead>
            <tr>
                <th>자재 코드</th>
                <th>자재명</th>
                <th>유형</th>
                <th>규격</th>
                <th>수량</th>
                <th>소모 방식</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(processMaterials)}">
                <td colspan="6" class="text-center">
                    등록된 소모 자재가 없습니다.
                </td>
            </tr>
            <tr th:each="processMaterial : ${processMaterials}">
                <td th:text="${processMaterial.item.code}"></td>
                <td th:text="${processMaterial.item.name}"></td>
                <td th:text="${processMaterial.item.type?.description}"></td>
                <td th:text="${@format.value(processMaterial.item.specification)}"></td>
                <td th:text="|${#numbers.formatDecimal(processMaterial.quantity, 1, 'COMMA', processMaterial.uom.scale, 'POINT')} ${processMaterial.uom.code}|"></td>
                <td th:text="${processMaterial.consumptionMethod?.description}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>

</html>
