<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('제품 출고 상세', ~{}, ~{::script}, 'SHIPMENT', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script type="module" th:src="@{/js/pages/shipment/detail.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('제품 출고 상세', '재고관리, 제품출고, 상세')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/shipments}'|">
            <i class="bi bi-list"></i> 목록
        </button>

        <button type="button"
                class="btn btn-primary btn-sm"
                th:onclick="|location.href='@{/shipments/{id}/edit(id=${shipment.id})}'|"
                sec:authorize="hasAuthority('SHIPMENT_UPDATE')">
            <i class="bi bi-pencil-square"></i> 수정
        </button>
        <button th:if="${shipment.status?.name == 'DRAFT'}"
                type="button"
                id="shipment-complete-button"
                class="btn btn-success btn-sm"
                th:data-id="${shipment.id}"
                sec:authorize="hasAuthority('SHIPMENT_UPDATE')">
            <i class="bi bi-check-circle"></i> 출고 완료
        </button>
    </div>

    <!--/* 상세 정보 */-->
    <div class="app-box app-box-bg">
        <table class="app-table-input" th:object="${shipment}">
            <colgroup>
                <col style="width: 150px">
                <col style="width: auto">
            </colgroup>
            <tbody>
            <tr>
                <th>출고 번호</th>
                <td th:text="*{shipmentNo}"></td>
            </tr>
            <tr>
                <th>거래처</th>
                <td th:text="*{partner.name}"></td>
            </tr>
            <tr>
                <th>수주 번호</th>
                <td>
                    <th:block th:if="*{salesOrder.id}">
                        <a class="fw-bold"
                           th:href="@{/sales-orders/{id}(id=*{salesOrder.id})}"
                           th:text="*{salesOrder.orderNo}"></a>
                    </th:block>
                    <th:block th:unless="*{salesOrder.id}">
                        <span>-</span>
                    </th:block>
                </td>
            </tr>
            <tr>
                <th>출고일</th>
                <td th:text="${#temporals.format(shipment.date, 'yyyy-MM-dd')}"></td>
            </tr>
            <tr>
                <th>비고</th>
                <td th:text="${@format.value(shipment.remark)}"></td>
            </tr>
            <tr>
                <th>상태</th>
                <td th:switch="${shipment.status.name}">
                        <h6 th:case="'DRAFT'" class="mb-0">
                            <span class="badge text-bg-secondary p-2 app-w-80"
                                  th:text="${shipment.status?.description}"></span>
                        </h6>
                        <h6 th:case="'COMPLETED'" class="mb-0">
                            <span class="badge text-bg-success p-2 app-w-80"
                                  th:text="${shipment.status?.description}"></span>
                        </h6>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!--/* 출고 제품 목록 */-->
    <div th:replace="~{pages/shipment-item/fragments/list :: list (${shipmentItems}, ${totalAmount})}"></div>
</div>
</body>
</html>
