<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!--/* 이미지 모달 */-->
<th:block th:fragment="modal">
    <div th:replace="~{fragments/modal/default :: default (
        'image-modal',
        '이미지',
         ~{::content},
         1000
    )}">
        <div th:fragment="content" class="p-2">
            <div class="modal-body pt-0">
                <div>
                    <img src="" alt="이미지를 찾을 수 없습니다."
                         class="modal-image img-fluid rounded mx-auto d-block"/>
                </div>
            </div>
        </div>
    </div>
</th:block>

</html>
