<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('사용자 상세', ~{}, ~{}, 'USER', ~{::#content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('사용자 상세', '기준정보관리, 사용자정보관리, 상세')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn"
                th:onclick="|location.href='@{/users}'|">
            <i class="fa fa-arrow-left" aria-hidden="true"></i> 목록
        </button>

        <button type="button"
                class="btn btn-primary"
                th:onclick="|location.href='@{/users/{id}/edit(id=${user.id})}'|"
                sec:authorize="hasAuthority('USER_UPDATE')">
            <i class="fa fa-pencil" aria-hidden="true"></i> 수정
        </button>
    </div>

    <!--/* 바디 */-->
    <div class="box box-bg">

        <table class="table-input xs" th:object="${user}">
            <colgroup>
                <col style="width: 150px">
                <col style="width: auto">
            </colgroup>
            <tbody>
            <tr>
                <th>ID</th>
                <td th:text="*{userId}"></td>
            </tr>
            <tr>
                <th>이름</th>
                <td th:text="*{name}"></td>
            </tr>
            <tr>
                <th>이메일</th>
                <td th:text="*{email}"></td>
            </tr>
            <tr>
                <th>전화번호</th>
                <td th:text="*{phone}"></td>
            </tr>
            <tr>
                <th>부서</th>
                <td th:text="*{department.name}"></td>
            </tr>
            <tr>
                <th>직책</th>
                <td th:text="*{position.name}"></td>
            </tr>
            <tr>
                <th>권한</th>
                <td th:text="*{role.name}"></td>
            </tr>
            <tr>
                <th>비고</th>
                <td th:text="*{remark}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
