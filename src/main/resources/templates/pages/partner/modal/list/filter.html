<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
>

<div th:fragment="filter (url, partnerType)">
    <form class="partner-search-form" method="GET" th:action="${url}">

        <input type="hidden" name="type" th:value="${partnerType}"/>

        <table class="app-table-input">
            <colgroup>
                <col style="width: 100px">
                <col style="width: auto">
                <col style="width: 100px">
                <col style="width: auto">
            </colgroup>
            <tbody>
            <tr>
                <th>거래처 코드</th>
                <td>
                    <input type="text"
                           name="code"
                           class="app-form-control app-xs"
                           th:value="${param.code}">
                </td>
                <th>거래처명</th>
                <td>
                    <input type="text"
                           name="name"
                           class="app-form-control app-xs"
                           th:value="${param.name}">
                </td>
            </tr>
            </tbody>
        </table>

        <div class="mt-2 text-end">
            <button type="submit" class="btn btn-secondary btn-sm">
                <i class="bi bi-search"></i> 조회
            </button>
        </div>
    </form>
</div>

</html>
