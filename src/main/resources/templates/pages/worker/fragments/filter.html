<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<div th:fragment="filter (url, departments, positions, count, showActions)">
    <form method="GET" th:action="${url}">
        <table class="app-table-input">
            <colgroup>
                <col style="width: 150px">
                <col style="width: auto">
                <col style="width: 150px">
                <col style="width: auto">
            </colgroup>
            <tbody>
            <tr>
                <th>작업자 코드</th>
                <td>
                    <input type="text"
                           name="code"
                           class="app-form-control app-xs"
                           th:value="${param.code}">
                </td>
                <th>작업자명</th>
                <td>
                    <input type="text"
                           name="name"
                           class="app-form-control app-xs"
                           th:value="${param.userName}">
                </td>
                <th>부서</th>
                <td>
                    <select name="departmentId"
                            class="app-form-control app-xs"
                            th:value="${param.departmentId}">
                        <option value="">전체</option>
                        <option th:if="${#lists.isEmpty(departments)}" disabled>
                            등록된 부서가 없습니다.
                        </option>
                        <option th:each="department : ${departments}"
                                th:value="${department.id}"
                                th:text="${@format.nameWithCode(department.code, department.name)}"
                                th:selected="${#strings.equals(param.departmentId, department.id)}"></option>
                    </select>
                </td>
                <th>직책</th>
                <td>
                    <select name="positionId"
                            class="app-form-control app-xs"
                            th:value="${param.positionId}">
                        <option value="">전체</option>
                        <option th:if="${#lists.isEmpty(positions)}" disabled>
                            등록된 직책이 없습니다.
                        </option>
                        <option th:each="position : ${positions}"
                                th:value="${position.id}"
                                th:text="${@format.nameWithCode(position.code, position.name)}"
                                th:selected="${#strings.equals(param.positionId, position.id)}"></option>
                    </select>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="mt-2 mb-2 text-end">
            <button type="submit" class="btn btn-secondary btn-sm">
                <i class="bi bi-search"></i> 조회
            </button>
        </div>

        <div class="d-flex justify-content-between mb-2">
            <div class="fw-bold"
                 th:text="|Total : ${count} 건|">
            </div>
            <div>
                <th:block th:if="${showActions}">
                    <button type="button"
                            class="btn btn-primary btn-sm"
                            th:onclick="|location.href='@{/workers/new}'|"
                            sec:authorize="hasAuthority('WORKER_CREATE')">
                        <i class="bi bi-plus-circle"></i> 등록
                    </button>
                    <button type="button"
                            id="worker-delete-button"
                            class="btn btn-danger btn-sm"
                            sec:authorize="hasAuthority('WORKER_DELETE')">
                        <i class="bi bi-trash"></i> 삭제
                    </button>
                </th:block>
            </div>
        </div>
    </form>
</div>

</html>
