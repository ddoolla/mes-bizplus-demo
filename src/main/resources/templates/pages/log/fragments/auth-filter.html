<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
>

<div th:fragment="filter (url, count)">
    <form id="auth-log-search-form" method="GET" th:action="${url}">
        <table class="app-table-input">
            <colgroup>
                <col style="width: 150px">
                <col style="width: auto">
                <col style="width: 150px">
                <col style="width: 500px">
            </colgroup>
            <tbody>
            <tr>
                <th>사용자 ID</th>
                <td>
                    <input type="text"
                           name="loginId"
                           class="app-form-control app-xs"
                           th:value="${param.loginId}">
                </td>
                <th>로그인 일시</th>
                <td>
                    <div class="d-flex gap-2 align-items-center">
                        <input type="text"
                               name="startDate"
                               class="app-form-control app-xs"
                               th:value="${param.startDate}"
                               readonly autocomplete="off"/>
                        <span>-</span>
                        <input type="text"
                               name="endDate"
                               class="app-form-control app-xs"
                               th:value="${param.endDate}"
                               readonly autocomplete="off"/>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="mt-2 mb-2 text-end">
            <button type="submit" class="btn btn-secondary btn-sm">
                <i class="bi bi-search"></i> 조회
            </button>
        </div>

        <div class="d-flex justify-content-between mb-2">
            <div class="fw-bold"
                 th:text="|Total : ${count} 건|">
            </div>
            <div>
                <button type="button"
                        class="btn btn-secondary btn-sm"
                        th:onclick="|location.href='@{/user-logs/action}'|">
                    <i class="bi bi-list"></i> 활동 이력
                </button>
                <!--<button type="button" class="btn btn-success"
                        th:onclick="|location.href='/accountExcel'|">
                    <i class="fa fa-file-excel-o" aria-hidden="true"> Excel 다운로드</i>
                </button>-->
            </div>
        </div>
    </form>
</div>

</html>
