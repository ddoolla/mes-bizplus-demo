<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('설비 상세', ~{}, ~{}, 'EQUIPMENT', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('설비 상세', '기준정보관리, 설비관리, 상세')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/equipments}'|">
            <i class="bi bi-list"></i> 목록
        </button>

        <button type="button"
                class="btn btn-primary btn-sm"
                th:onclick="|location.href='@{/equipments/{id}/edit(id=${equipment.id})}'|"
                sec:authorize="hasAuthority('EQUIPMENT_UPDATE')">
            <i class="bi bi-pencil-square"></i> 수정
        </button>
    </div>

    <!--/* 상세 정보 */-->
    <div class="app-box app-box-bg">
        <table class="app-table-input" th:object="${equipment}">
            <colgroup>
                <col style="width: 150px">
                <col style="width: auto">
            </colgroup>
            <tbody>
            <tr>
                <th>설비 코드</th>
                <td th:text="*{code}"></td>
            </tr>
            <tr>
                <th>설비명</th>
                <td th:text="*{name}"></td>
            </tr>
            <tr>
                <th>설비 유형</th>
                <td th:text="${@format.nameWithCode(equipment.type.code, equipment.type.name)}"></td>
            </tr>
            <tr>
                <th>규격</th>
                <td th:text="${@format.value(equipment.specification)}"></td>
            </tr>
            <tr>
                <th>제조사</th>
                <td th:text="${@format.value(equipment.manufacturer)}"></td>
            </tr>
            <tr>
                <th>모델</th>
                <td th:text="${@format.value(equipment.model)}"></td>
            </tr>
            <tr>
                <th>시리얼 번호</th>
                <td th:text="${@format.value(equipment.serialNo)}"></td>
            </tr>
            <tr>
                <th>설치 위치</th>
                <td th:text="${@format.value(equipment.location)}"></td>
            </tr>
            <tr>
                <th>비고</th>
                <td th:text="${@format.value(equipment.remark)}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
