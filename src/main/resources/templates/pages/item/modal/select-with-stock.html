<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!--/* 출고 제품 선택 모달 */-->
<th:block th:fragment="modal (url, itemGroup, itemCategories, itemTypes)">
    <div th:replace="~{fragments/modal/default :: default (
        'item-select-with-stock-modal',
        '품목 선택',
         ~{::.app-modal-content},
         1200
    )}">
        <div class="app-modal-content p-2">
            <div class="modal-body">
                <!--/* 필터 */-->
                <div>
                    <form class="item-search-form" method="GET" th:action="${url}">

                        <input type="hidden" name="group" th:value="${itemGroup}">

                        <table class="app-table-input">
                            <colgroup>
                                <col style="width: 80px">
                                <col style="width: 160px">
                                <col style="width: 80px">
                                <col style="width: 160px">
                                <col style="width: 80px">
                                <col style="width: 160px">
                                <col style="width: 80px">
                                <col style="width: 160px">
                            </colgroup>
                            <tbody>
                            <tr>
                                <th>품목 코드</th>
                                <td>
                                    <input type="text"
                                           name="code"
                                           class="app-form-control app-xs"
                                           th:value="${param.code}">
                                </td>
                                <th>품목명</th>
                                <td>
                                    <input type="text"
                                           name="name"
                                           class="app-form-control app-xs"
                                           th:value="${param.name}">
                                </td>
                                <th>유형</th>
                                <td>
                                    <select name="type"
                                            class="app-form-control app-xs">
                                        <option value="">전체</option>
                                        <option th:each="type : ${itemTypes}"
                                                th:value="${type?.name()}"
                                                th:text="${type?.getDescription()}">
                                        </option>
                                    </select>
                                </td>
                                <th>카테고리</th>
                                <td>
                                    <select name="categoryId"
                                            class="app-form-control app-xs">
                                        <option value="">
                                            전체
                                        </option>
                                        <option th:if="${#lists.isEmpty(itemCategories)}" value="" disabled>
                                            등록된 카테고리가 없습니다.
                                        </option>
                                        <option th:each="category : ${itemCategories}"
                                                th:value="${category.id}"
                                                th:text="${category.name}">
                                        </option>
                                    </select>
                                </td>
                            </tr>
                            </tbody>
                        </table>

                        <div class="mt-2 text-end">
                            <button type="submit" class="btn btn-secondary btn-sm">
                                <i class="bi bi-search"></i> 조회
                            </button>
                        </div>
                    </form>
                </div>

                <!--/* 목록 */-->
                <div class="list-content">

                </div>
            </div>
        </div>
    </div>
</th:block>

<!--/* 모달 목록 콘텐츠 */-->
<th:block th:fragment="list">
    <div class="d-flex justify-content-start">
        <div class="fw-bold"
             th:text="|Total : ${data.pagination.totalElements} 건|">
        </div>
    </div>
    <div id="item-table">
        <table class="app-table-list text-center">
            <colgroup>
                <col style="width: 200px">
                <col style="width: 200px">
                <col style="width: 150px">
                <col style="width: 150px">
                <col style="width: auto">
                <col style="width: 150px">
                <col style="width: 100px">
                <col style="width: 100px">
            </colgroup>
            <thead>
            <tr>
                <th>품목 코드</th>
                <th>품목명</th>
                <th>유형</th>
                <th>카테고리</th>
                <th>규격</th>
                <th>재고</th>
                <th>로트 관리</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(data.items)}">
                <td colspan="8" class="p-4">등록된 품목 정보가 없습니다.</td>
            </tr>
            <tr th:each="item : ${data.items}">
                <td th:text="${item.code}"></td>
                <td th:text="${item.name}"></td>
                <td th:text="${item.type?.description}"></td>
                <td th:text="${@format.value(item.category.name)}"></td>
                <td th:text="${@format.value(item.specification)}"></td>
                <td th:text="|${#numbers.formatDecimal(item.stock, 1, 'COMMA', item.uom.scale, 'POINT')} ${item.uom.code}|"></td>
                <td th:text="${item.lotManaged ? '예' : '아니오'}"></td>
                <td>
                    <button type="button"
                            class="item-select-button
                                   btn btn-primary btn-sm"
                            th:data-id="${item.id}"
                            th:data-name="${item.name}"
                            th:text="${item.lotManaged ? 'LOT 선택' : '추가'}">
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!--/* 페이지네이션 */-->
    <div th:replace="~{fragments/pagination :: pagination (${data.pagination})}"></div>
</th:block>

</html>
