<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('제품 공정 상세', ~{}, ~{}, 'ROUTING', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('제품 공정 상세', '기준정보관리, 제품공정관리, 상세')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/routings}'|">
            <i class="fa fa-arrow-left" aria-hidden="true"></i> 목록
        </button>

        <button type="button"
                class="btn btn-primary btn-sm"
                th:onclick="|location.href='@{/routings/{id}/edit(id=${routing.id})}'|"
                sec:authorize="hasAuthority('ROUTING_UPDATE')">
            <i class="fa fa-pencil" aria-hidden="true"></i> 수정
        </button>
    </div>

    <!--/* 바디 */-->
    <div class="app-box app-box-bg">

        <table class="app-table-input" th:object="${routing}">
            <colgroup>
                <col style="width: 150px">
                <col style="width: auto">
            </colgroup>
            <tbody>
            <tr>
                <th>제품</th>
                <td th:text="*{item.name}"></td>
            </tr>
            <tr>
                <th>제품 공정 코드</th>
                <td th:text="*{code}"></td>
            </tr>
            <tr>
                <th>제품 공정명</th>
                <td th:text="*{name}"></td>
            </tr>
            <tr>
                <th>버전</th>
                <td th:text="${@format.value(routing.version)}"></td>
            </tr>
            <tr>
                <th>기본 공정 여부</th>
                <td th:text="${routing.primary ? '예' : '아니오'}"></td>
            </tr>
            <tr>
                <th>설명</th>
                <td th:text="${@format.value(routing.description)}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
