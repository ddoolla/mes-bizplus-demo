<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout ('제품 공정 목록', ~{}, ~{::script}, 'ROUTING', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script type="module" th:src="@{/js/pages/routing/list.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('제품 공정 목록', '기준정보관리, 제품공정관리')}">
    </div>

    <!--/* 바디 */-->
    <div class="app-box app-box-bg">
        <!--/* 필터 */-->
        <div th:replace="~{pages/routing/fragments/filter :: filter ('/routings', ${data.pagination.totalElements}, true)}">
        </div>

        <!--/* 목록 */-->
        <div id="routing-table">
            <table class="app-table-list text-center">
                <colgroup>
                    <col style="width: 50px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: auto">
                </colgroup>
                <thead>
                <tr>
                    <th><input type="checkbox" class="check-all"/></th>
                    <th>제품 공정 코드</th>
                    <th>제품 공정명</th>
                    <th>제품명</th>
                    <th>버전</th>
                    <th>기본 공정 여부</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="routing : ${data.routings}">
                    <td>
                        <input type="checkbox"
                               class="check-item"
                               th:value="${routing.id}"/>
                    </td>
                    <td class="fw-bold">
                        <a th:href="@{/routings/{id}(id=${routing.id})}"
                           th:text="${routing.code}"></a>
                    </td>
                    <td th:text="${routing.name}"></td>
                    <td th:text="${routing.item.name}"></td>
                    <td th:text="${@format.value(routing.version)}"></td>
                    <td th:text="${routing.primary ? '예' : '아니오'}"></td>
                    <td></td>
                </tr>
                </tbody>
            </table>
        </div>

        <!--/* 페이지네이션 */-->
        <div th:replace="~{fragments/pagination :: pagination (${data.pagination})}"></div>
    </div>
</div>
</body>
</html>
