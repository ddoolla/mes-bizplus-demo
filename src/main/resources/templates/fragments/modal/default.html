<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="default (id, title, content, size)">
    <div class="modal fade"
         th:id="${id}"
         tabindex="-1"
         th:with="label=${id + '-label'}"
         th:aria-labelledby="${label}"
         aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered"
             th:with="size=${size ?: 500}"
             th:style="|max-width: ${size}px|">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5"
                        th:id="${label}"
                        th:text="${title}">
                    </h1>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close">
                    </button>
                </div>
                <th:block th:replace="${content}">
                    <!--<div class="modal-body"></div>-->
                    <!--<div class="modal-footer"></div>-->
                </th:block>
            </div>
        </div>
    </div>
</th:block>

</html>
