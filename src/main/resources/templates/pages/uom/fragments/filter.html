<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<script src="../../../../static/js/common/checkbox.js"></script>
<div th:fragment="filter (url, count, showActions)">
    <form method="GET" th:action="${url}">
        <table class="app-table-input">
            <colgroup>
                <col style="width: 150px">
                <col style="width: auto">
                <col style="width: 150px">
                <col style="width: auto">
            </colgroup>

            <tbody>
            <tr>
                <th>
                    <label for="code">단위 코드</label>
                </th>
                <td>
                    <input type="text"
                           id="code"
                           name="code"
                           class="app-form-control app-xs"
                           th:value="${param.code}">
                </td>
                <th>
                    <label for="name">단위명</label>
                </th>
                <td>
                    <input type="text"
                           id="name"
                           name="name"
                           class="app-form-control app-xs"
                           th:value="${param.name}">
                </td>
            </tr>
            </tbody>
        </table>

        <div class="mt-2 mb-2 text-end">
            <button type="submit" class="btn btn-secondary btn-sm">
                <i class="bi bi-search"></i> 조회
            </button>
        </div>

        <div class="d-flex justify-content-between mb-2">
            <div class="fw-bold"
                 th:text="|Total : ${count} 건|">
            </div>
            <div>
                <th:block th:if="${showActions}">
                    <button type="button"
                            class="btn btn-secondary btn-sm"
                            sec:authorize="hasAuthority('UOM_READ')"
                            th:onclick="|location.href='@{/uoms/conversions}'|">
                        <i class="bi bi-arrow-left-right"></i> 단위 환산
                    </button>
                    <button type="button"
                            id="uom-create-button"
                            class="btn btn-primary btn-sm"
                            sec:authorize="hasAuthority('UOM_CREATE')">
                        <i class="bi bi-plus-circle"></i> 등록
                    </button>
                    <button type="button"
                            id="uom-delete-button"
                            class="btn btn-danger btn-sm"
                            sec:authorize="hasAuthority('UOM_DELETE')">
                        <i class="bi bi-trash"></i> 삭제
                    </button>
                </th:block>
            </div>
        </div>
    </form>
</div>
</html>
