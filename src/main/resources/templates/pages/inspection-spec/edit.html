<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('검사기준 수정', ~{}, ~{::script}, 'INSPECTION_SPEC', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script type="module" th:src="@{/js/pages/inspection-spec/edit.js}"></script>
    <script type="module" th:src="@{/js/pages/inspection-spec-item/form.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('검사기준 수정', '기준정보관리, 검사기준관리, 상세, 수정')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/inspection-specs/{id}(id=${inspectionSpec.id})}'|">
            <i class="bi bi-x-circle"></i> 취소
        </button>

        <button type="submit"
                form="inspection-spec-edit-form"
                class="btn btn-primary btn-sm"
                sec:authorize="hasAuthority('INSPECTION_SPEC_UPDATE')">
            <i class="bi bi-floppy"></i> 저장
        </button>
    </div>

    <form id="inspection-spec-edit-form"
          method="post"
          th:action="@{/inspection-specs/{id}(id=${inspectionSpec.id})}"
          th:object="${inspectionSpec}"
          th:with="item=${inspectionSpec.item}, process=${inspectionSpec.process}">

        <!--/* 검사기준 수정 양식 */-->
        <div class="app-box app-box-bg">
            <input type="hidden" name="id" th:value="*{id}"/>

            <table class="app-table-input">
                <colgroup>
                    <col style="width: 150px">
                    <col style="width: 500px">
                    <col style="width: 150px">
                    <col style="width: auto">
                </colgroup>
                <tbody>
                <tr>
                    <th>검사기준 코드 <span class="app-required">*</span></th>
                    <td>
                        <input type="text"
                               name="code"
                               class="app-form-control app-xs"
                               th:value="*{code}"
                               placeholder="검사기준 코드를 입력해 주세요."/>
                    </td>
                    <th>품목 코드</th>
                    <td th:text="*{item.code}"></td>
                </tr>
                <tr>
                    <th>검사기준명 <span class="app-required">*</span></th>
                    <td>
                        <input type="text"
                               name="name"
                               class="app-form-control app-xs"
                               th:value="*{name}"
                               placeholder="검사기준명을 입력해 주세요."/>
                    </td>
                    <th>품목명</th>
                    <td th:text="*{item.name}"></td>
                </tr>
                <tr>
                    <th>검사 유형</th>
                    <td th:text="*{type?.description}"></td>
                    <th>유형</th>
                    <td th:text="*{item.type?.description}"></td>
                </tr>
                <tr>
                    <th>버전</th>
                    <td>
                        <input type="text"
                               name="version"
                               th:value="*{version}"
                               class="app-form-control app-xs"/>
                    </td>
                    <th>규격</th>
                    <td th:text="${@format.value(inspectionSpec.item.specification)}"></td>
                </tr>
                <tr th:if="*{type.name == 'IN_PROCESS'}">
                    <th>공정</th>
                    <td colspan="3"
                        th:text="${@format.nameWithCode(process.code, process.name)}"></td>
                </tr>
                <tr th:unless="*{type.name == 'IN_PROCESS'}">
                    <th>기본 검사기준</th>
                    <td colspan="3">
                        <label>
                            <input type="checkbox"
                                   name="isDefault"
                                   value="true"
                                   th:checked="*{isDefault}"
                                   class="app-form-control app-xs"/>
                            기본 검사기준으로 사용
                        </label>
                    </td>
                </tr>
                <tr>
                    <th>비고</th>
                    <td colspan="3">
                        <input type="text"
                               name="remark"
                               th:value="*{remark}"
                               class="app-form-control app-xs"/>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!--/* 검사항목 수정 양식 */-->
        <div th:replace="~{pages/inspection-spec-item/fragments/form :: form (
        ${inspectionSpec},
        ${inspectionSpecItems})}">
        </div>
    </form>

    <!--/* 검사항목 목록 모달 */-->
    <div th:replace="~{pages/inspection-item/modal/list/container :: container (
        @{/inspection-items/modal/list/multiple},
        ${inspectionGroups})}">
    </div>
</div>
</body>
</html>
