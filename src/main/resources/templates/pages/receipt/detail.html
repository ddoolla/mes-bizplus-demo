<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('자재 입고 상세', ~{}, ~{::script}, 'RECEIPT', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script type="module" th:src="@{/js/pages/receipt/detail.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('자재 입고 상세', '재고관리, 자재입고, 상세')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/receipts}'|">
            <i class="bi bi-list"></i> 목록
        </button>

        <button type="button"
                class="btn btn-primary btn-sm"
                th:onclick="|location.href='@{/receipts/{id}/edit(id=${receipt.id})}'|"
                sec:authorize="hasAuthority('RECEIPT_UPDATE')">
            <i class="bi bi-pencil-square"></i> 수정
        </button>
        <button th:if="${receipt.status?.name == 'DRAFT'}"
                type="button"
                id="receipt-complete-button"
                class="btn btn-success btn-sm"
                th:data-id="${receipt.id}"
                sec:authorize="hasAuthority('RECEIPT_UPDATE')">
            <i class="bi bi-check-circle"></i> 입고 완료
        </button>
    </div>

    <!--/* 상세 정보 */-->
    <div class="app-box app-box-bg">
        <table class="app-table-input" th:object="${receipt}">
            <colgroup>
                <col style="width: 150px">
                <col style="width: auto">
            </colgroup>
            <tbody>
            <tr>
                <th>수주 번호</th>
                <td th:text="*{receiptNo}"></td>
            </tr>
            <tr>
                <th>거래처</th>
                <td th:text="*{partner.name}"></td>
            </tr>
            <tr>
                <th>입고일</th>
                <td th:text="${#temporals.format(receipt.date, 'yyyy-MM-dd')}"></td>
            </tr>
            <tr>
                <th>비고</th>
                <td th:text="${@format.value(receipt.remark)}"></td>
            </tr>
            <tr>
                <th>상태</th>
                <td th:switch="${receipt.status.name}">
                        <h6 th:case="'DRAFT'" class="mb-0">
                            <span class="badge text-bg-secondary p-2"
                                  th:text="${receipt.status?.description}"></span>
                        </h6>
                        <h6 th:case="'COMPLETED'" class="mb-0">
                            <span class="badge text-bg-success p-2"
                                  th:text="${receipt.status?.description}"></span>
                        </h6>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!--/* 입고 자재 목록 */-->
</div>
</body>
</html>
