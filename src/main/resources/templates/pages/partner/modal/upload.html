<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!--/* 거래처 목록 엑셀 업로드 모달 */-->
<th:block th:fragment="modal">
    <div th:replace="~{fragments/modal/default :: default (
        'partner-excel-upload-modal',
        '거래처 목록 엑셀 업로드',
         ~{::.app-modal-content},
         600
    )}">
        <div class="app-modal-content p-2">
            <div class="modal-body">
                <div class="mb-3">
                    <div>
                        <p class="fs-6">
                            다운로드한 거래처 목록 엑셀 양식에 데이터를 입력한 후 업로드해 주세요.<br/><br/>
                            ※ 엑셀 양식의 열 이름 및 순서는 변경하지 마세요.
                        </p>
                    </div>
                    <div>
                        <form id="excel-upload-form"
                              method="post"
                              th:action="@{/api/partners/excel/upload}"
                              enctype="multipart/form-data">
                            <input type="file"
                                   name="file"
                                   class="form-control"/>
                        </form>
                    </div>
                    <div class="mt-2 text-end">
                        <button type="submit"
                                form="excel-upload-form"
                                class="btn btn-primary">
                            <i class="bi bi-upload"></i> 업로드
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>

</html>
