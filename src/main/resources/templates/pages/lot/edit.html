<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('LOT 수정', ~{}, ~{::script}, 'LOT', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script type="module" th:src="@{/js/pages/lot/edit.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('LOT 수정', '재고관리, LOT관리, 상세, 수정')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/lots/{id}(id=${lot.id})}'|">
            <i class="bi bi-x-circle"></i> 취소
        </button>

        <button type="submit"
                form="lot-edit-form"
                class="btn btn-primary btn-sm"
                sec:authorize="hasAuthority('LOT_UPDATE')">
            <i class="bi bi-floppy"></i> 저장
        </button>
    </div>

    <!--/* 수정 폼 */-->
    <div class="app-box app-box-bg">
        <form id="lot-edit-form"
              method="post"
              th:action="@{/lots/{id}(id=${lot.id})}"
              th:object="${lot}">
            <table class="app-table-input">
                <colgroup>
                    <col style="width: 150px">
                    <col style="width: 500px">
                    <col style="width: 150px">
                    <col style="width: auto">
                </colgroup>
                <tbody>
                <tr>
                    <th>LOT 번호</th>
                    <td colspan="3" th:text="*{no}"></td>
                </tr>
                <tr>
                    <th>품목 코드</th>
                    <td th:text="*{item.code}"></td>
                    <th>유형</th>
                    <td th:text="*{item.type?.description}"></td>
                </tr>
                <tr>
                    <th>품목명</th>
                    <td th:text="*{item.name}"></td>
                    <th>규격</th>
                    <td th:text="${@format.value(lot.item.specification)}"></td>
                </tr>
                <tr>
                    <th>제조 일자</th>
                    <td th:text="${#temporals.format(lot.manufactureDate, 'yyyy-MM-dd')} ?: '-'"></td>
                    <th>유효 기간</th>
                    <td>
                        <input type="text"
                               name="expirationDate"
                               class="app-form-control app-xs"
                               th:value="${#temporals.format(lot.expirationDate, 'yyyy-MM-dd')}"
                               readonly/>
                    </td>
                </tr>
                <tr>
                    <th>비고</th>
                    <td colspan="3">
                        <input type="text"
                               name="remark"
                               class="app-form-control app-xs"
                               th:value="*{remark}"/>
                    </td>
                </tr>
                </tbody>
            </table>
        </form>
    </div>
</div>
</body>
</html>
