<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('거래처 등록', ~{}, ~{::script}, 'PARTNER', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <!--/* 다음 우편번호 API */-->
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

    <script th:src="@{/js/common/address.js}"></script>
    <script th:src="@{/js/partner/new.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('거래처 등록', '기준정보관리, 거래처관리, 등록')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/partners}'|">
            <i class="fa fa-arrow-left" aria-hidden="true"></i> 목록
        </button>

        <button type="submit"
                form="create-partner-form"
                class="btn btn-primary btn-sm"
                sec:authorize="hasAuthority('PARTNER_CREATE')">
            <i class="fa fa-pencil" aria-hidden="true"></i> 저장
        </button>
    </div>

    <!--/* 바디 */-->
    <div class="app-box app-box-bg">
        <form id="create-partner-form" method="post" th:action="@{/partners}">
            <table class="app-table-input">
                <colgroup>
                    <col style="width: 150px">
                    <col style="width: auto">
                    <col style="width: 150px">
                    <col style="width: auto">
                </colgroup>
                <tbody>
                <tr>
                    <th>
                        <label for="partner-code">
                            거래처 코드 <span class="app-required">*</span>
                        </label>
                    </th>
                    <td>
                        <input type="text"
                               id="partner-code"
                               name="code"
                               class="app-form-control app-xs"
                               placeholder="거래처 코드를 입력해 주세요."/>
                    </td>
                    <th>
                        <label for="partner-type">
                            거래처 유형 <span class="app-required">*</span>
                        </label>
                    </th>
                    <td>
                        <select name="type"
                                id="partner-type"
                                class="app-form-control app-xs">
                            <option th:each="type: ${partnerTypes}"
                                    th:value="${type?.name()}"
                                    th:text="${type?.getDescription()}">
                            </option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="partner-name">
                            거래처명 <span class="app-required">*</span>
                        </label>
                    </th>
                    <td>
                        <input type="text"
                               id="partner-name"
                               name="name"
                               class="app-form-control app-xs"
                               placeholder="거래처명을 입력해 주세요."/>
                    </td>
                    <th>
                        <label for="partner-ceoName">
                            대표자명
                        </label>
                    </th>
                    <td>
                        <input type="text"
                               id="partner-ceoName"
                               name="ceoName"
                               class="app-form-control app-xs"/>
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="business-no">
                            사업자등록번호
                        </label>
                    </th>
                    <td>
                        <input type="text"
                               id="business-no"
                               name="businessNo"
                               class="app-form-control app-xs"/>
                    </td>
                    <th>
                        <label for="corporate-no">
                            법인등록번호
                        </label>
                    </th>
                    <td>
                        <input type="text"
                               id="corporate-no"
                               name="corporateNo"
                               class="app-form-control app-xs"/>
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="tel">
                            전화번호
                        </label>
                    </th>
                    <td>
                        <input type="text"
                               id="tel"
                               name="tel"
                               class="app-form-control app-xs"/>
                    </td>
                    <th>
                        <label for="fax">
                            팩스번호
                        </label>
                    </th>
                    <td>
                        <input type="text"
                               id="fax"
                               name="fax"
                               class="app-form-control app-xs"/>
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="partner-email">
                            이메일
                        </label>
                    </th>
                    <td>
                        <input type="text"
                               id="partner-email"
                               name="email"
                               class="app-form-control app-xs"/>
                    </td>
                    <th>
                        <label for="home-page">
                            홈페이지
                        </label>
                    </th>
                    <td>
                        <input type="text"
                               id="home-page"
                               name="home-page"
                               class="app-form-control app-xs"/>
                    </td>
                </tr>
                <tr>
                    <th rowspan="3">
                        <label for="partner-address">
                            주소
                        </label>
                    </th>
                    <td colspan="3">
                        <input type="text"
                               id="partner-address"
                               name="zipCode"
                               class="app-form-control app-xs w-25"
                               placeholder="우편번호"/>
                        <button type="button"
                                id="address-search-button"
                                class="btn btn-secondary app-btn-xs">
                            <i class="fa fa-search" aria-hidden="true"></i> 주소찾기
                        </button>
                    </td>
                </tr>
                <tr>
                    <td colspan="3">
                        <input type="text"
                               name="address"
                               class="app-form-control app-xs"
                               placeholder="주소"/>
                    </td>
                </tr>
                <tr>
                    <td colspan="3">
                        <input type="text"
                               name="addressDetail"
                               class="app-form-control app-xs"
                               placeholder="상세주소"/>
                    </td>
                </tr>
                <tr>
                    <th>
                        <label for="partner-remark">비고</label>
                    </th>
                    <td colspan="3">
                        <input type="text"
                               id="partner-remark"
                               name="remark"
                               class="app-form-control app-xs"/>
                    </td>
                </tr>
                </tbody>
            </table>
        </form>
    </div>
</div>
</body>
</html>
