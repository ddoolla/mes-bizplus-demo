                <nav class="sidebar-subItem">

                       class="sidebar-link"
                       th:classappend="${active == menuItem.code ? 'active' : ''}"
                       th:text="${menuItem.name}"></a>
                </nav>
            </li>

    <script type="text/javascript">
        $(function () {

            $('.sidebar-label').on('click', function () {
                const $label = $(this);
                const $subMenu = $label.next('.sidebar-subItem');

                // 클릭 연타 방지
                $subMenu.stop(true, true).slideToggle();
                $label.toggleClass('expanded');
            });

            const $active = $('.sidebar-link.active');

            if ($active.length) {
                $active.closest('.sidebar-item')
                    .find('> .sidebar-label')
                    .trigger('click');
            }
        });
    </script>
