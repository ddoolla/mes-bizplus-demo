<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('거래처 수정', ~{}, ~{::script}, 'PARTNER', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <!--/* 다음 우편번호 API */-->
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

    <script type="module" th:src="@{/js/pages/partner/edit.js}"></script>
    <script type="module" th:src="@{/js/pages/partner-contact/manage.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('거래처 수정', '기준정보관리, 거래처관리, 상세, 수정')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/partners/{id}(id=${partner.id})}'|">
            <i class="bi bi-x-circle"></i> 취소
        </button>

        <button type="submit"
                form="partner-edit-form"
                class="btn btn-primary btn-sm"
                sec:authorize="hasAuthority('PARTNER_UPDATE')">
            <i class="bi bi-floppy"></i> 저장
        </button>
    </div>

    <!--/* 거래처 수정 폼 */-->
    <div class="app-box app-box-bg">
        <form id="partner-edit-form" method="post" th:action="@{/partners/{id}(id=${partner.id})}">
            <table class="app-table-input" th:object="${partner}">
                <colgroup>
                    <col style="width: 150px">
                    <col style="width: 500px">
                    <col style="width: 150px">
                    <col style="width: auto">
                </colgroup>
                <tbody>
                <tr>
                    <th>거래처 코드 <span class="app-required">*</span></th>
                    <td>
                        <input type="text"
                               name="code"
                               class="app-form-control app-xs"
                               th:value="*{code}"
                               placeholder="거래처 코드를 입력해 주세요."/>
                        <input type="hidden"
                               name="id"
                               th:value="*{id}"/>
                    </td>
                    <th>거래처 유형 <span class="app-required">*</span></th>
                    <td>
                        <select name="type"
                                id="partner-type"
                                class="app-form-control app-xs">
                            <option th:each="type: ${partnerTypes}"
                                    th:value="${type?.name()}"
                                    th:text="${type?.getDescription()}"
                                    th:selected="${partner.type?.name() == type?.name()}">
                            </option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <th>거래처명 <span class="app-required">*</span></th>
                    <td>
                        <input type="text"
                               name="name"
                               class="app-form-control app-xs"
                               th:value="*{name}"
                               placeholder="거래처명을 입력해 주세요."/>
                    </td>
                    <th>대표자명</th>
                    <td>
                        <input type="text"
                               name="ceoName"
                               th:value="*{ceoName}"
                               class="app-form-control app-xs"/>
                    </td>
                </tr>
                <tr>
                    <th>사업자등록번호</th>
                    <td>
                        <input type="text"
                               name="businessNo"
                               th:value="*{businessNo}"
                               class="app-form-control app-xs"/>
                    </td>
                    <th>법인등록번호</th>
                    <td>
                        <input type="text"
                               name="corporateNo"
                               th:value="*{corporateNo}"
                               class="app-form-control app-xs"/>
                    </td>
                </tr>
                <tr>
                    <th>전화번호</th>
                    <td>
                        <input type="text"
                               name="tel"
                               th:value="*{tel}"
                               class="app-form-control app-xs"/>
                    </td>
                    <th>팩스번호</th>
                    <td>
                        <input type="text"
                               name="fax"
                               th:value="*{fax}"
                               class="app-form-control app-xs"/>
                    </td>
                </tr>
                <tr>
                    <th>이메일</th>
                    <td>
                        <input type="text"
                               name="email"
                               th:value="*{email}"
                               class="app-form-control app-xs"/>
                    </td>
                    <th>홈페이지</th>
                    <td>
                        <input type="text"
                               name="home-page"
                               th:value="*{homePage}"
                               class="app-form-control app-xs"/>
                    </td>
                </tr>
                <tr>
                    <th rowspan="3">주소</th>
                    <td colspan="3">
                        <input type="text"
                               name="zipCode"
                               class="app-form-control app-xs w-25"
                               th:value="*{zipCode}"
                               placeholder="우편번호"/>
                        <button type="button"
                                id="address-search-button"
                                class="btn btn-secondary app-btn-xs">
                            <i class="bi bi-search"></i> 주소찾기
                        </button>
                    </td>
                </tr>
                <tr>
                    <td colspan="3">
                        <input type="text"
                               name="address"
                               class="app-form-control app-xs"
                               th:value="*{address}"
                               placeholder="주소"/>
                    </td>
                </tr>
                <tr>
                    <td colspan="3">
                        <input type="text"
                               name="addressDetail"
                               class="app-form-control app-xs"
                               th:value="*{addressDetail}"
                               placeholder="상세주소"/>
                    </td>
                </tr>
                <tr>
                    <th>비고</th>
                    <td colspan="3">
                        <input type="text"
                               name="remark"
                               class="app-form-control app-xs"
                               th:value="*{remark}"/>
                    </td>
                </tr>
                </tbody>
            </table>
        </form>
    </div>

    <!--/* 거래처 담당자 관리 화면 */-->
    <div th:replace="~{pages/partner-contact/fragments/manage :: manage (${partner}, ${partnerContacts})}"></div>

    <!--/* 거래처 담당자 폼 모달 */-->
    <div th:replace="~{pages/partner-contact/modal/form/container :: container}"></div>
</div>
</body>
</html>
