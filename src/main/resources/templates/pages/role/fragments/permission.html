<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!--/* 상세 페이지용 */-->
<th:block th:fragment="list (actions, menuPermissions)">
    <div>
        <table class="table-input xs">
            <colgroup>
                <col style="width: 150px"/>
                <col th:each="action : ${actions}" style="width: 100px"/>
                <col style="width: auto"/>
            </colgroup>
            <thead>
            <tr>
                <th>메뉴</th>
                <th th:each="action : ${actions}"
                    th:text="${action.description}">
                </th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="menuPermission : ${menuPermissions}">
                <td th:text="${menuPermission.menu}" class="ft-bold"></td>
                <td th:each="action : ${actions}">
                    <input type="checkbox"
                           name="permissionIds"
                           th:value="${menuPermission.permissions.get(action)?.id}"
                           th:checked="${menuPermission.permissions.get(action)?.checked}"
                           disabled/>
                    <span th:unless="${menuPermission.permissions.get(action) != null}">
                        -
                    </span>
                </td>
                <td></td>
            </tr>
            </tbody>
        </table>
    </div>
</th:block>

<!--/* 수정 페이지용 */-->
<th:block th:fragment="editor (actions, menuPermissions)">
    <div>
        <table class="table-input xs">
            <colgroup>
                <col style="width: 150px"/>
                <col style="width: 100px"/>
                <col th:each="action : ${actions}" style="width: 100px"/>
                <col style="width: auto"/>
            </colgroup>
            <thead>
            <tr>
                <th>메뉴</th>
                <th>전체</th>
                <th th:each="action : ${actions}"
                    th:text="${action.description}">
                </th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="menuPermission : ${menuPermissions}">
                <td th:text="${menuPermission.menu}" class="ft-bold"></td>
                <td>
                    <label style="display:block; width:100%; height:100%; cursor:pointer;">
                        <input type="checkbox"
                               class="menu-all-check"
                               style="cursor: pointer"/>
                    </label>
                </td>
                <td th:each="action : ${actions}">
                    <label th:if="${menuPermission.permissions.get(action) != null}"
                           style="display:block; width:100%; height:100%; cursor:pointer;">
                        <input type="checkbox"
                               name="permissionIds"
                               class="permission-check"
                               th:value="${menuPermission.permissions.get(action)?.id}"
                               th:checked="${menuPermission.permissions.get(action)?.checked}"
                               style="cursor: pointer"/>
                    </label>
                    <span th:unless="${menuPermission.permissions.get(action) != null}">
                        -
                    </span>
                </td>
                <td></td>
            </tr>
            </tbody>
        </table>
    </div>
    <script>
        /* 진입 시 전체 체크박스 업데이트 */
        document.querySelectorAll('tr').forEach(row => {

            const allCheck = row.querySelector('.menu-all-check');

            if (!allCheck) {
                return;
            }

            const permissions = row.querySelectorAll('.permission-check');

            const checked = row.querySelectorAll('.permission-check:checked');

            allCheck.checked = permissions.length > 0 && permissions.length === checked.length;
        });

        /* 전체 체크박스 변경 시 */
        document.querySelectorAll('.menu-all-check').forEach(allCheck => {

            allCheck.addEventListener('change', function () {

                const row = this.closest('tr');

                row.querySelectorAll('.permission-check').forEach(permission => {

                    permission.checked = this.checked;
                });
            });
        });

        /* 개별 체크박스 변경 시 */
        document.querySelectorAll('.permission-check').forEach(permission => {

            permission.addEventListener('change', function () {

                const row = this.closest('tr');

                const permissions = row.querySelectorAll('.permission-check');

                const checked = row.querySelectorAll('.permission-check:checked');

                row.querySelector('.menu-all-check').checked = permissions.length === checked.length;
            });
        });
    </script>
</th:block>

</html>
