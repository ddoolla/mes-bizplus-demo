<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="form (workOrders)">
    <div class="app-box app-box-bg mt-2">
        <div class="d-flex justify-content-between">
            <div>
                <p class="h5 fw-bold">작업지시 목록</p>
            </div>
            <div>
                <button type="button"
                        id="work-order-create-button"
                        class="btn btn-primary btn-sm me-1">
                    <i class="bi bi-plus-circle"></i> 추가
                </button>
                <button type="button"
                        id="work-order-delete-button"
                        class="btn btn-danger btn-sm">
                    <i class="bi bi-trash"></i> 삭제
                </button>
            </div>
        </div>

        <div id="work-order-table">
            <table class="app-table-list text-center">
                <colgroup>
                    <col style="width: 50px">
                    <col style="width: 150px">
                    <col style="width: 150px">
                    <col style="width: 150px">
                    <col style="width: 150px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: auto">
                    <col style="width: 100px">
                </colgroup>
                <thead>
                <tr>
                    <th><input type="checkbox" class="check-all"/></th>
                    <th>작업지시 번호</th>
                    <th>작업 공정</th>
                    <th>작업 일자</th>
                    <th>작업 수량</th>
                    <th>설비</th>
                    <th>작업자</th>
                    <th>전달사항</th>
                    <th>상태</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(workOrders)}">
                    <td colspan="9" class="p-4">등록된 작업지시 정보가 없습니다.</td>
                </tr>
                <tr th:each="workOrder, stat : ${workOrders}">
                    <input type="hidden"
                           th:name="|workOrders[${stat.index}].id|"
                           th:value="${workOrder.id}"/>
                    <td>
                        <input type="checkbox"
                               class="check-item"
                               th:value="${workOrder.id}"/>
                    </td>
                    <td th:text="${workOrder.orderNo}"></td>
                    <td th:text="${workOrder.process.name}"></td>
                    <td>
                        <input type="text"
                               th:name="|workOrders[${stat.index}].date|"
                               class="work-order-date
                                      app-form-control app-xs "
                               th:value="${#temporals.format(workOrder.date, 'yyyy-MM-dd')}"
                               readonly/>
                    </td>
                    <td>
                        <input type="number"
                               th:name="|workOrders[${stat.index}].quantity|"
                               class="work-order-quantity
                                      app-form-control app-xs "
                               th:value="${#numbers.formatDecimal(workOrder.quantity, 1, workOrder.item.uom.scale)}"/>
                    </td>
                    <td>
                        <div class="d-flex gap-1">
                            <input type="text"
                                   th:name="|workOrders[${stat.index}].equipmentName|"
                                   class="work-order-equipment
                                          app-form-control app-xs app-readonly-bg"
                                   th:value="${workOrder.equipment.name}"
                                   readonly/>
                            <input type="hidden"
                                   th:name="|workOrders[${stat.index}].equipmentId|"
                                   th:value="${workOrder.equipment.id}"/>
                            <button type="button"
                                    class="equipment-list-button
                                           btn btn-secondary app-btn-xs"
                                    th:data-index="${stat.index}">
                                <i class="bi bi-list"></i>
                            </button>
                        </div>
                    </td>
                    <td>
                        <div class="d-flex gap-1">
                            <input type="text"
                                   th:name="|workOrders[${stat.index}].userName|"
                                   class="work-order-user
                                          app-form-control app-xs app-readonly-bg"
                                   th:value="${workOrder.user.name}"
                                   readonly/>
                            <input type="hidden"
                                   th:name="|workOrders[${stat.index}].userId|"
                                   th:value="${workOrder.user.id}"/>
                            <button type="button"
                                    class="user-list-button
                                           btn btn-secondary app-btn-xs"
                                    th:data-index="${stat.index}">
                                <i class="bi bi-list"></i>
                            </button>
                        </div>
                    </td>
                    <td>
                        <input type="text"
                               th:name="|workOrders[${stat.index}].remark|"
                               class="app-form-control app-xs "
                               th:value="${workOrder.remark}"/>
                    </td>
                    <td th:switch="${workOrder.status?.name}">
                        <h6 th:case="'PENDING'" class="mb-0">
                            <span class="badge text-bg-secondary p-2"
                                  th:text="${workOrder.status?.description}"></span>
                        </h6>
                        <h6 th:case="'IN_PROGRESS'" class="mb-0">
                            <span class="badge text-bg-primary p-2"
                                  th:text="${workOrder.status?.description}"></span>
                        </h6>
                        <h6 th:case="'COMPLETED'" class="mb-0">
                            <span class="badge text-bg-success p-2"
                                  th:text="${workOrder.status?.description}"></span>
                        </h6>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>

</html>
