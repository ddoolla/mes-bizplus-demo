<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layouts/main :: layout ('공정 상세', ~{}, ~{}, 'PROCESS', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('공정 상세', '기준정보관리, 공정관리, 상세')}">
    </div>

    <!--/* 버튼 영역 */-->
    <div class="action-bar">
        <button type="button"
                class="btn btn-secondary btn-sm"
                th:onclick="|location.href='@{/processes}'|">
            <i class="bi bi-list"></i> 목록
        </button>

        <button type="button"
                class="btn btn-primary btn-sm"
                th:onclick="|location.href='@{/processes/{id}/edit(id=${process.id})}'|"
                sec:authorize="hasAuthority('PROCESS_UPDATE')">
            <i class="bi bi-pencil-square"></i> 수정
        </button>
    </div>

    <!--/* 바디 */-->
    <div class="app-box app-box-bg">

        <table class="app-table-input" th:object="${process}">
            <colgroup>
                <col style="width: 150px">
                <col style="width: auto">
            </colgroup>
            <tbody>
            <tr>
                <th>공정 코드</th>
                <td th:text="*{code}"></td>
            </tr>
            <tr>
                <th>공정명</th>
                <td th:text="*{name}"></td>
            </tr>
            <tr>
                <th>설명</th>
                <td th:text="${@format.value(process.description)}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
