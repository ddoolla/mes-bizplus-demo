<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="form">
    <div class="modal-body">
        <form id="code-edit-form"
              method="post"
              th:action="@{/common-codes/{id}(id=${commonCode.id})}">

            <input type="hidden" name="groupId" th:value="${codeGroup.id}"/>
            <input type="hidden" name="id" th:value="${commonCode.id}"/>

            <table class="app-table-input">
                <colgroup>
                    <col style="width: 150px">
                    <col style="width: auto">
                </colgroup>
                <tbody>
                <tr>
                    <th>
                        코드 <span class="app-required">*</span>
                    </th>
                    <td>
                        <input type="text"
                               name="code"
                               class="app-form-control app-xs"
                               th:value="${commonCode.code}"
                               placeholder="코드를 입력해 주세요."/>
                        <input type="hidden"
                               id="id"
                               name="id"/>
                    </td>
                </tr>
                <tr>
                    <th>
                        코드명 <span class="app-required">*</span>
                    </th>
                    <td>
                        <input type="text"
                               name="name"
                               class="app-form-control app-xs"
                               th:value="${commonCode.name}"
                               placeholder="권한 이름을 입력해 주세요."/>
                    </td>
                </tr>
                <tr>
                    <th>
                        코드 설명
                    </th>
                    <td>
                        <input type="text"
                               name="description"
                               th:value="${commonCode.description}"
                               class="app-form-control app-xs"/>
                    </td>
                </tr>
                </tbody>
            </table>
        </form>
    </div>
    <div class="modal-footer">
        <button type="button"
                class="btn btn-secondary btn-sm"
                data-bs-dismiss="modal">
            <i class="bi bi-x-circle"></i> 취소
        </button>
        <button type="submit"
                form="code-edit-form"
                class="btn btn-primary btn-sm">
            <i class="bi bi-floppy"></i> 저장
        </button>
    </div>
</th:block>

</html>
