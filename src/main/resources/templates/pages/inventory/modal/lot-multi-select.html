<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!--/* 품목 목록 모달 */-->
<th:block th:fragment="modal">
    <div th:replace="~{fragments/modal/default :: default (
        'inventory-lot-multi-select-modal',
        '로트 선택',
         ~{::.app-modal-content},
         800
    )}">
        <div class="app-modal-content"></div>
    </div>
</th:block>

<!--/* 품목 목록 모달 콘텐츠 */-->
<th:block th:fragment="content">
    <div class="modal-body">
        <div class="d-flex justify-content-between">
            <div>
                <button type="button"
                        class="back-button
                               btn btn-secondary btn-sm">
                    <i class="bi bi-chevron-left"></i> 목록
                </button>
            </div>
            <div>
                <button type="button"
                        class="lot-register-button
                               btn btn-primary btn-sm">
                    <i class="bi bi-check-circle"></i> 등록
                </button>
            </div>
        </div>
        <div>
            <table class="app-table-list text-center">
                <colgroup>
                    <col style="width: 50px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                </colgroup>
                <thead>
                <tr>
                    <th colspan="3"
                        class="bg-secondary-subtle text-center"
                        th:text="${@format.nameWithCode(item.code, item.name)}"></th>
                </tr>
                <tr>
                    <th><input type="checkbox" class="check-all"/></th>
                    <th>로트 번호</th>
                    <th>재고 수량</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(inventories)}">
                    <td colspan="3" class="p-4">등록된 로트 정보가 없습니다.</td>
                </tr>
                <tr th:each="inventory : ${inventories}">
                    <td>
                        <input type="checkbox"
                               class="check-item"
                               th:value="${inventory.id}"/>
                    </td>
                    <td th:text="${inventory.lot.no}"></td>
                    <td th:text="|${#numbers.formatDecimal(inventory.quantity, 1, 'COMMA', inventory.item.uom.scale, 'POINT')} ${inventory.item.uom.code}|"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</th:block>

</html>
