<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout ('재고 현황', ~{}, ~{::script}, 'ITEM_INVENTORY', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script type="module" th:src="@{/js/pages/inventory/list.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('재고 현황', '재고관리, 재고현황')}">
    </div>

    <!--/* 바디 */-->
    <div class="app-box app-box-bg">
        <!--/* 필터 */-->
        <div th:replace="~{pages/inventory/fragments/filter :: filter ('/inventories', ${data.pagination.totalElements}, false)}">
        </div>

        <!--/* 목록 */-->
        <div id="inventory-table">
            <table class="app-table-list text-center">
                <colgroup>
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: 150px">
                    <col style="width: 150px">
                    <col style="width: auto">
                    <col style="width: 200px">
                    <col style="width: 100px">
                    <col style="width: 150px">
                </colgroup>
                <thead>
                <tr>
                    <th>품목 코드</th>
                    <th>품목명</th>
                    <th>품목 유형</th>
                    <th>품목 카테고리</th>
                    <th>규격</th>
                    <th>재고 수량</th>
                    <th>로트 관리 여부</th>
                    <th>LOT별 재고</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(data.inventories)}">
                    <td colspan="8" class="p-4">등록된 재고 정보가 없습니다.</td>
                </tr>
                <tr th:each="inventory : ${data.inventories}">
                    <td th:text="${inventory.item.code}"></td>
                    <td th:text="${inventory.item.name}"></td>
                    <td th:text="${inventory.item.type?.description}"></td>
                    <td th:text="${@format.value(inventory.item.category)}"></td>
                    <td th:text="${@format.value(inventory.item.specification)}"></td>
                    <td th:text="|${#numbers.formatDecimal(inventory.totalQuantity, 1, 'COMMA', inventory.item.uom.scale, 'POINT')} ${inventory.item.uom.code}|"></td>
                    <td th:text="${inventory.item.lotManaged ? '예' : '아니오'}"></td>
                    <td>
                        <th:block th:if="${inventory.item.lotManaged}">
                            <button type="button"
                                    class="inventory-detail-button
                                           btn btn-secondary btn-sm"
                                    th:data-item-id="${inventory.item.id}">
                                상세보기
                            </button>
                        </th:block>
                        <th:block th:unless="${inventory.item.lotManaged}">
                            <span>-</span>
                        </th:block>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!--/* 페이지네이션 */-->
        <div th:replace="~{fragments/pagination :: pagination (${data.pagination})}"></div>

        <!--/* 상세보기 */-->
        <div th:replace="~{pages/inventory/modal/detail :: modal}"></div>
    </div>
</div>
</body>
</html>
