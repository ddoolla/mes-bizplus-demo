<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout ('생산실적 목록', ~{}, ~{::script}, 'PRODUCTION_RESULT', ~{::#app-content})}">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script type="module" th:src="@{/js/pages/production-result/list.js}"></script>
</head>
<body>
<!--/* 콘텐츠 */-->
<div id="app-content">
    <!--/* 헤더 */-->
    <div th:replace="~{fragments/content :: header ('생산실적 목록', '생산관리, 생산실적')}">
    </div>

    <!--/* 바디 */-->
    <div class="app-box app-box-bg">
        <!--/* 필터 */-->
        <div th:replace="~{pages/production-result/fragments/filter :: filter ('/production-results', ${data.pagination.totalElements})}">
        </div>

        <!--/* 목록 */-->
        <div id="production-result-table">
            <table class="app-table-list text-center">
                <colgroup>
                    <col style="width: 150px">
                    <col style="width: 150px">
                    <col style="width: 200px">
                    <col style="width: 200px">
                    <col style="width: 150px">
                    <col style="width: auto">
                    <col style="width: 150px">
                    <col style="width: 150px">
                    <col style="width: 150px">
                </colgroup>
                <thead>
                <tr>
                    <th>생산지시 번호</th>
                    <th>생산일</th>
                    <th>제품 코드</th>
                    <th>제품명</th>
                    <th>유형</th>
                    <th>규격</th>
                    <th>생산 수량</th>
                    <th>양품 수량</th>
                    <th>불량 수량</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(data.productionResults)}">
                    <td colspan="9" class="p-4">등록된 생산실적 정보가 없습니다.</td>
                </tr>
                <tr th:each="result : ${data.productionResults}">
                    <td class="fw-bold">
                        <a th:href="@{/production-orders/{id}(id=${result.productionOrder.id})}"
                           th:text="${result.productionOrder.orderNo}"></a>
                    </td>
                    <td th:text="${#temporals.format(result.completedAt, 'yyyy-MM-dd')}"></td>
                    <td th:text="${result.item.code}"></td>
                    <td th:text="${result.item.name}"></td>
                    <td th:text="${result.item.type?.description}"></td>
                    <td th:text="${@format.value(result.item.specification)}"></td>
                    <td th:text="|${#numbers.formatDecimal(result.totalQuantity, 1, 'COMMA', result.item.uom.scale, 'POINT')} ${result.item.uom.code}|"></td>
                    <td th:text="|${#numbers.formatDecimal(result.goodQuantity, 1, 'COMMA', result.item.uom.scale, 'POINT')} ${result.item.uom.code}|"></td>
                    <td th:text="|${#numbers.formatDecimal(result.defectQuantity, 1, 'COMMA', result.item.uom.scale, 'POINT')} ${result.item.uom.code}|"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <!--/* 페이지네이션 */-->
        <div th:replace="~{fragments/pagination :: pagination (${data.pagination})}"></div>
    </div>
</div>
</body>
</html>
