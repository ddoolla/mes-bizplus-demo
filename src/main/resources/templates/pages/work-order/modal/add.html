<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<!--/* 생산지시 공정 목록 모달 */-->
<th:block th:fragment="modal (productionOrderProcesses)">
    <div th:replace="~{fragments/modal/default :: default (
        'work-order-add-modal',
        '작업지시 등록',
         ~{::content},
         null
    )}">
        <div th:fragment="content" class="p-2">
            <div class="modal-body pt-0">
                <div class="production-order-process-list">
                    <div class="d-flex justify-content-sm-between mt-1">
                        <div class="d-flex align-items-end">
                            <p class="fw-bold mb-0"
                               th:text="|Total : ${productionOrderProcesses.size()} 건|"></p>
                        </div>
                        <div>
                            <button type="button"
                                    class="create-confirm-button
                                           btn btn-primary btn-sm">
                                <i class="bi bi-check-circle"></i> 등록
                            </button>
                        </div>
                    </div>
                    <div id="process-table">
                        <table class="app-table-list text-center">
                            <colgroup>
                                <col style="width: 50px">
                                <col style="width: 200px">
                                <col style="width: 200px">
                                <col style="width: 200px">
                                <col style="width: auto">
                            </colgroup>
                            <thead>
                            <tr>
                                <th><input type="checkbox" class="check-all"/></th>
                                <th>공정 코드</th>
                                <th>공정명</th>
                                <th>단계</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${#lists.isEmpty(productionOrderProcesses)}">
                                <td colspan="8" class="p-4">등록된 생산지시 공정 정보가 없습니다.</td>
                            </tr>
                            <tr th:each="pop : ${productionOrderProcesses}">
                                <td>
                                    <input type="checkbox"
                                           class="check-item"
                                           th:value="${pop.id}"/>
                                </td>
                                <td th:text="${pop.code}"></td>
                                <td th:text="${pop.name}"></td>
                                <td th:text="${pop.stepNo}"></td>
                                <td></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>

</html>
